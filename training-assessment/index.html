<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Starting Point Assessment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: sticky step rail on the left, one section of questions at a time, barbell that loads a plate per finished section. */
:root {
  --bg: #f3f4f1;
  --surface: #ffffff;
  --sunk: #e9ebe6;
  --ink: #17201c;
  --muted: #5c6862;
  --line: #d4d9d3;
  --accent: #1f4fa3;
  --accent-ink: #ffffff;
  --p-red: #c8322b;
  --p-blue: #1f4fa3;
  --p-yellow: #e2b007;
  --p-green: #2e8b4e;
  --p-white: #f4f4f0;
  --p-edge: #1b1f1d;
  --ok: #2e7d4f;
  --warn: #a86a00;
  --crit: #b3261e;
  --ok-bg: #e3f1e8;
  --warn-bg: #fbf0d9;
  --crit-bg: #f9e2df;
  --f-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101412; --surface: #181d1b; --sunk: #222826; --ink: #e7ebe8; --muted: #9aa69f; --line: #2e3633;
    --accent: #7ea2ea; --accent-ink: #0d1424; --p-white: #dcdcd6; --p-edge: #0a0c0b;
    --ok: #6cc591; --warn: #e3b14f; --crit: #f08a80; --ok-bg: #16291e; --warn-bg: #2d2412; --crit-bg: #33191a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101412; --surface: #181d1b; --sunk: #222826; --ink: #e7ebe8; --muted: #9aa69f; --line: #2e3633;
  --accent: #7ea2ea; --accent-ink: #0d1424; --p-white: #dcdcd6; --p-edge: #0a0c0b;
  --ok: #6cc591; --warn: #e3b14f; --crit: #f08a80; --ok-bg: #16291e; --warn-bg: #2d2412; --crit-bg: #33191a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.55 var(--f-body); padding-inline: 16px; padding-block: 0 48px; }
.wrap { max-width: 1120px; margin: 0 auto; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 700; letter-spacing: .01em; text-wrap: balance; margin: 0; line-height: 1.05; }
h1 { font-size: clamp(30px, 5vw, 44px); text-transform: uppercase; }
h2 { font-size: 30px; text-transform: uppercase; }
h3 { font-size: 20px; text-transform: uppercase; letter-spacing: .03em; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.eyebrow { font: 500 11px/1.2 var(--f-mono); text-transform: uppercase; letter-spacing: .12em; color: var(--muted); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* header */
header.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; padding-block: 28px 18px; border-bottom: 1px solid var(--line); }
header.top p { margin: 6px 0 0; color: var(--muted); max-width: 60ch; }
.tabs { display: flex; gap: 4px; background: var(--sunk); padding: 4px; border-radius: var(--r); max-width: 100%; overflow-x: auto; }
.tabs button { white-space: nowrap; }
.active-client { font-size: 13px; color: var(--muted); margin-top: 6px; text-align: right; }
.active-client b { color: var(--ink); }
:root { --viz-lean: #1f4fa3; --viz-fat: #c8322b; --viz-grid: #dfe3de; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --viz-lean: #5b86d9; --viz-fat: #d9645a; --viz-grid: #2a312e; } }
:root[data-theme="dark"] { --viz-lean: #5b86d9; --viz-fat: #d9645a; --viz-grid: #2a312e; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; }
.stat .v { font: 700 32px/1 var(--f-display); font-variant-numeric: tabular-nums; }
.stat .d { font: 500 12px var(--f-mono); }
.stat .d.good { color: var(--ok); } .stat .d.bad { color: var(--crit); } .stat .d.flat { color: var(--muted); }
.chart { position: relative; width: 100%; }
.chart svg { width: 100%; height: auto; display: block; overflow: visible; }
.chart text { font: 500 11px var(--f-mono); fill: var(--muted); }
.tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--bg); padding: 8px 10px; border-radius: 4px; font-size: 12px; line-height: 1.4; white-space: nowrap; transform: translate(-50%, calc(-100% - 10px)); z-index: 3; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; color: var(--muted); }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.site-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px 14px; }
.site-grid label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600; }
.site-grid input { max-width: 100%; }
.client-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.client { background: var(--bg); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
.client.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.client .meta { font-size: 13px; color: var(--muted); }
select.inp { max-width: 100%; min-width: 0; font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 8px 10px; }
.tabs button { border: 0; background: transparent; padding: 8px 14px; border-radius: 4px; cursor: pointer; font-weight: 600; font-size: 14px; color: var(--muted); }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }

/* barbell */
.bar-row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; padding-block: 16px; }
.bar-row svg { flex: 1 1 320px; max-width: 520px; height: 64px; }
.load { font: 500 13px/1.3 var(--f-mono); color: var(--muted); }
.load b { font: 700 26px/1 var(--f-display); color: var(--ink); display: block; }

/* layout */
.grid { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 32px; align-items: start; }
@media (max-width: 820px) { .grid { grid-template-columns: minmax(0, 1fr); gap: 16px; } }
nav.steps { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); display: flex; flex-direction: column; gap: 2px; }
@media (max-width: 820px) { nav.steps { position: static; flex-direction: row; overflow-x: auto; padding-bottom: 4px; } }
nav.steps button { display: grid; grid-template-columns: 18px 1fr auto; align-items: center; gap: 10px; text-align: left; border: 0; background: transparent; padding: 8px 10px; border-radius: 4px; cursor: pointer; color: var(--muted); font-size: 14px; white-space: nowrap; }
nav.steps button:hover { background: var(--sunk); }
nav.steps button[aria-current="step"] { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: inset 0 0 0 1px var(--line); }
.dot { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--p-edge); }
.tick { font: 500 11px var(--f-mono); color: var(--ok); }

/* section */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: clamp(18px, 3vw, 32px); min-width: 0; }
.sec-head { display: flex; gap: 14px; align-items: flex-start; padding-bottom: 18px; border-bottom: 1px solid var(--line); margin-bottom: 8px; }
.sec-head .plate { flex: none; width: 38px; height: 38px; border-radius: 50%; border: 2px solid var(--p-edge); display: grid; place-items: center; font: 700 13px var(--f-display); }
.sec-head p { margin: 6px 0 0; color: var(--muted); max-width: 62ch; }
.fields { display: flex; flex-direction: column; }
.field { padding-block: 16px; border-bottom: 1px dashed var(--line); display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.field:last-child { border-bottom: 0; }
.field > label, .field > .lbl { font-weight: 600; font-size: 15px; }
.req { color: var(--p-red); margin-left: 2px; }
.help { color: var(--muted); font-size: 13px; margin-top: -4px; }
.row2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 0 24px; border-bottom: 1px dashed var(--line); }
.row2 .field { border-bottom: 0; }
.fields > .row2:last-child { border-bottom: 0; }
input[type=text], input[type=email], input[type=tel], input[type=number], textarea {
  font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 9px 11px; width: 100%; max-width: 520px;
}
input[type=number] { max-width: 160px; font-family: var(--f-mono); }
textarea { min-height: 84px; resize: vertical; max-width: 100%; }
input:focus, textarea:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
.unit { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; max-width: 100%; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--bg); padding: 6px 12px; border-radius: 999px; cursor: pointer; font-size: 14px; line-height: 1.3; }
.chip:hover { border-color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.scale { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 4px; max-width: 520px; }
.scale .chip { padding: 7px 0; border-radius: 4px; text-align: center; font-family: var(--f-mono); font-size: 13px; }
.scale-lbls { display: flex; justify-content: space-between; max-width: 520px; font-size: 12px; color: var(--muted); }

/* injury + lifts tables */
.inj { display: flex; flex-direction: column; gap: 0; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.inj-row { padding: 12px 14px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
.inj-row:last-child { border-bottom: 0; }
.inj-top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
.inj-top b { font-weight: 600; }
.inj-detail { display: flex; flex-direction: column; gap: 10px; padding-left: 12px; border-left: 2px solid var(--p-yellow); }
.tbl-wrap { overflow-x: auto; }
table.lifts { border-collapse: collapse; min-width: 420px; }
table.lifts th { text-align: left; font: 500 11px var(--f-mono); text-transform: uppercase; letter-spacing: .1em; color: var(--muted); padding: 6px 10px 6px 0; }
table.lifts td { padding: 6px 10px 6px 0; }
table.lifts td:first-child { font-weight: 500; padding-right: 18px; white-space: nowrap; }
table.lifts input { max-width: 96px; }
table.sb { min-width: 720px; width: 100%; }
table.sb td { vertical-align: top; padding-block: 8px; }
table.sb tr.sb-group th { padding-top: 14px; color: var(--ink); border-bottom: 1px solid var(--line); }
.e1rm { font-family: var(--f-mono); color: var(--muted); font-size: 13px; white-space: nowrap; }

.nav-btns { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; margin-top: 20px; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 10px 18px; border-radius: 4px; cursor: pointer; font-weight: 600; font-size: 14px; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--crit); }
.utility { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; color: var(--muted); font-size: 13px; }
.note { background: var(--sunk); border-radius: var(--r); padding: 12px 14px; font-size: 14px; color: var(--muted); }
.toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 4px; font-size: 14px; z-index: 5; }

/* report */
.report { display: flex; flex-direction: column; gap: 20px; }
.rep-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; align-items: flex-end; }
.rep-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card h3 { display: flex; align-items: center; gap: 8px; }
.card h3 .dot { width: 12px; height: 12px; }
.kv { display: grid; grid-template-columns: minmax(96px, max-content) minmax(0, 1fr); gap: 6px 16px; font-size: 14px; }
.kv dt { color: var(--muted); }
.kv.left dd { text-align: left; }
.kv dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; font-weight: 500; overflow-wrap: anywhere; }
.big { font: 700 34px/1 var(--f-display); }
.big small { font: 500 13px var(--f-mono); color: var(--muted); margin-left: 6px; }
.flags { display: flex; flex-direction: column; gap: 8px; }
.flag { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start; padding: 10px 12px; border-radius: 4px; font-size: 14px; }
.flag .pill { font: 500 10px/1 var(--f-mono); text-transform: uppercase; letter-spacing: .1em; padding: 5px 7px; border-radius: 3px; color: var(--surface); margin-top: 1px; }
.flag.crit { background: var(--crit-bg); } .flag.crit .pill { background: var(--crit); }
.flag.warn { background: var(--warn-bg); } .flag.warn .pill { background: var(--warn); }
.flag.ok { background: var(--ok-bg); } .flag.ok .pill { background: var(--ok); }
.meter { height: 8px; background: var(--sunk); border-radius: 4px; overflow: hidden; }
.meter i { display: block; height: 100%; border-radius: 4px; }
ul.plain { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
.ratio { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 6px 12px; font-size: 14px; align-items: center; }
.ratio span:nth-child(3n+2) { font-family: var(--f-mono); }
.tag { font: 500 11px var(--f-mono); padding: 3px 7px; border-radius: 3px; white-space: nowrap; }
.tag.ok { background: var(--ok-bg); color: var(--ok); } .tag.warn { background: var(--warn-bg); color: var(--warn); } .tag.muted { background: var(--sunk); color: var(--muted); }
.proto { display: grid; grid-template-columns: minmax(110px, 160px) minmax(0, 1fr); gap: 12px 18px; margin: 0; font-size: 14px; }
.proto dt { font: 500 11px/1.6 var(--f-mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding-top: 2px; }
.proto dd { margin: 0; }
.proto.tight { grid-template-columns: minmax(56px, 84px) minmax(0, 1fr); gap: 8px 12px; }
.proto dd b { display: block; font-weight: 600; }
.proto dd span { color: var(--muted); }
@media (max-width: 560px) { .proto { grid-template-columns: minmax(0, 1fr); gap: 2px; } .proto dd { margin-bottom: 10px; } }
table.road { border-collapse: collapse; width: 100%; min-width: 720px; font-size: 14px; }
table.road th { text-align: left; font: 500 11px var(--f-mono); text-transform: uppercase; letter-spacing: .1em; color: var(--muted); padding: 8px 10px 8px 0; border-bottom: 1px solid var(--line); }
table.road td { padding: 10px 10px 10px 0; border-bottom: 1px dashed var(--line); vertical-align: top; }
table.road tr.deload td { background: var(--sunk); }
table.road tr.deload td:first-child { padding-left: 8px; }
table.road td:first-child { font-weight: 600; white-space: nowrap; }
.wk { font: 500 12px var(--f-mono); color: var(--muted); display: block; font-weight: 500; }
.map-row { display: grid; grid-template-columns: minmax(150px, 220px) minmax(0, 1fr); gap: 10px 18px; padding: 12px 0; border-bottom: 1px dashed var(--line); }
.map-row:last-child { border-bottom: 0; }
.map-row .chips .chip { font-size: 13px; }
.map-row input[type=text] { max-width: 100%; font-size: 13px; padding: 6px 9px; }
@media (max-width: 640px) { .map-row { grid-template-columns: minmax(0, 1fr); } }
.answers { display: flex; flex-direction: column; gap: 18px; }
.answers h3 { font-size: 17px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
.answers dl { display: grid; grid-template-columns: minmax(140px, 38%) minmax(0, 1fr); gap: 6px 18px; margin: 10px 0 0; font-size: 14px; }
.answers dt { color: var(--muted); }
.answers dd { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
@media (max-width: 560px) { .answers dl { grid-template-columns: minmax(0, 1fr); } .answers dd { margin-bottom: 6px; } }
.example-banner { background: var(--warn-bg); color: var(--warn); border-radius: 4px; padding: 8px 12px; font-size: 13px; font-weight: 600; }
.empty { text-align: center; padding: 48px 16px; color: var(--muted); }
.empty h2 { color: var(--ink); margin-bottom: 8px; }
@media (prefers-reduced-motion: no-preference) { .plate-g { transition: opacity .3s, transform .3s; } }
@media print {
  body { background: #fff; color: #000; padding: 0; }
  header.top .tabs, .bar-row, nav.steps, .nav-btns, .utility, .no-print { display: none !important; }
  .grid { display: block; }
  .card, .panel { break-inside: avoid; border-color: #bbb; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow" id="coachLine">New client intake</div>
      <h1>Starting Point Assessment</h1>
      <p>About 15 minutes. Your answers tell your coach where your training, nutrition and recovery start, so the first program fits you. Your progress saves in this browser as you go.</p>
    </div>
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-form" aria-selected="true" data-view="form">Client form</button>
      <button role="tab" id="tab-report" aria-selected="false" data-view="report">Coach report</button>
      <button role="tab" id="tab-measure" aria-selected="false" data-view="measure">Measurements</button>
      <button role="tab" id="tab-progress" aria-selected="false" data-view="progress">Progress</button>
      <button role="tab" id="tab-clients" aria-selected="false" data-view="clients">Clients</button>
      <button role="tab" id="tab-library" aria-selected="false" data-view="library">Program library</button>
    </div>
  </header>

  <section id="view-form">
    <div class="bar-row">
      <svg id="barbell" viewBox="0 0 520 64" role="img" aria-label="Progress barbell"></svg>
      <div class="load"><b id="loadKg">20 kg</b><span id="loadTxt">empty bar · 0 of 8 sections</span></div>
    </div>
    <div class="grid">
      <nav class="steps" id="steps" aria-label="Sections"></nav>
      <div>
        <form class="panel" id="panel" novalidate></form>
        <div class="utility" style="margin-top:14px">
          <button class="btn ghost" type="button" id="loadExample">Load an example client</button>
          <button class="btn ghost danger" type="button" id="clearBtn">Clear all answers</button>
          <span id="saveState"></span>
        </div>
      </div>
    </div>
  </section>

  <section id="view-report" hidden></section>
  <section id="view-library" hidden></section>
  <section id="view-measure" hidden></section>
  <section id="view-progress" hidden></section>
  <section id="view-clients" hidden></section>
</div>
<div class="toast" id="toast" hidden></div>

<script>
/* ---------- Coach settings: fill these in before sending the page to clients ---------- */
const COACH = { name: "", email: "" };

/* Program length: two 12-week blocks with a deload week between, reassessed every 4 weeks. */
const PROGRAM_PLAN = { blockWeeks: 12, deloadWeeks: 1, blocks: 2, reassessEvery: 4 };

/* Coaching rules for everyone below Advanced (tiers 0–2: Novice, Developing, Intermediate). */
const COACH_RULES = {
  advancedTier: 3,            // tier at which the normal (heavier, more frequent) programming starts
  repRange: "6–15",           // no heavy loading (under 6 reps) for at least the first year
  firstMonthsDays: 2,         // full-body sessions per week during the foundation phase
  foundationWeeks: 8,         // beginners: 2 full-body days for at least 8 weeks, then basic lifts + KILO splits
  foundationWeeks50: 12,      // clients 50+: foundation runs the whole first block
  ageSlow: 50,                // 50+ take longer to get back to normal: smaller jumps, longer foundation
  minCommitMonths: 6,         // no programs under 6 months
  gbc: [6, 12, 25],           // block 2: GBC with A series sets of 6, B series 12, C series 25
  laterMaxDays: 4,            // cap after the foundation phase
  phaseWeeks: 4,              // each phase / exercise selection runs 4 weeks
  unilateralTiers: [0, 1],    // these tiers train one limb at a time for the whole 6 months
  unilateralBlock1Tiers: [2]  // these tiers stay unilateral in block 1, then may add bilateral lifts (still 6–15 reps)
};

/* Building-block exercises: one 4-week stage per phase of block 1, unilateral where possible.
   Block 2 keeps the stage 3 exercise and progresses load and tempo within the rep range. */

/* ---------- Client profiles (coach's browser only) ---------- */
const BOOK_KEY = "starting-point-clients-v1";
let book = { clients: {}, active: null };
try { const b = JSON.parse(localStorage.getItem(BOOK_KEY) || "null"); if (b && b.clients) book = b; } catch (e) {}
function saveBook() { try { localStorage.setItem(BOOK_KEY, JSON.stringify(book)); } catch (e) { toast("This browser can't save profiles. Export a backup."); } }
function activeClient() { return book.active ? book.clients[book.active] || null : null; }

/* ---------- State ---------- */
const STORE_KEY = "starting-point-intake-v1";
let data = { units: IMPERIAL };
let step = 0;
let isExample = false;
try { const s = JSON.parse(localStorage.getItem(STORE_KEY) || "null"); if (s && s.data) { data = s.data; step = s.step || 0; isExample = !!s.example; } } catch (e) {}
function save() {
  const cl = activeClient();
  if (cl && !isExample) { cl.intake = data; cl.name = data.name || cl.name; cl.updated = Date.now(); saveBook(); }
  try { localStorage.setItem(STORE_KEY, JSON.stringify({ data, step, example: isExample })); $("#saveState").textContent = cl ? `Saved to ${cl.name || "client"}'s profile` : "Saved in this browser"; }
  catch (e) { $("#saveState").textContent = "This browser can't save progress; finish in one sitting"; }
}

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const filled = v => v !== undefined && v !== null && v !== "" && !(Array.isArray(v) && !v.length);
const num = v => { if (v === "" || v == null) return null; const n = parseFloat(v); return isFinite(n) ? n : null; };
const flat = fs => fs.flatMap(f => f.group ? f.group : [f]);
const SHOW = {};

/* ---------- Rendering the form ---------- */
function fieldHTML(f) {
  if (f.show) SHOW[f.id] = f.show;
  const unit = typeof f.unit === "function" ? f.unit(data) : f.unit;
  const sec = SECTIONS[step];
  const req = sec.req.includes(f.id) ? '<span class="req" aria-hidden="true">*</span>' : "";
  const help = f.help ? `<div class="help">${esc(f.help)}</div>` : "";
  const v = data[f.id];
  const lbl = `<label for="f-${f.id}">${esc(f.label)}${req}</label>`;
  const lblDiv = `<div class="lbl" id="l-${f.id}">${esc(f.label)}${req}</div>`;
  let body = "";
  switch (f.type) {
    case "text": case "email": case "tel":
      return wrap(f, lbl + help + `<input id="f-${f.id}" type="${f.type}" data-f="${f.id}" value="${esc(v)}" autocomplete="off">`);
    case "number":
      return wrap(f, lbl + help + `<span class="unit"><input id="f-${f.id}" type="number" inputmode="decimal" step="any" data-f="${f.id}" value="${esc(v)}"><span data-unit="${f.id}">${esc(unit || "")}</span></span>`);
    case "textarea":
      return wrap(f, lbl + help + `<textarea id="f-${f.id}" data-f="${f.id}">${esc(v)}</textarea>`);
    case "chips": case "multi":
      body = f.options.map(o => {
        const on = f.type === "multi" ? (v || []).includes(o) : v === o;
        return `<button type="button" class="chip" data-chip="${f.id}" data-multi="${f.type === "multi" ? 1 : 0}" data-v="${esc(o)}" aria-pressed="${on}">${esc(o)}</button>`;
      }).join("");
      return wrap(f, lblDiv + help + `<div class="chips" role="group" aria-labelledby="l-${f.id}" id="f-${f.id}">${body}</div>`);
    case "scale": {
      const n = f.max - f.min + 1;
      for (let i = f.min; i <= f.max; i++) body += `<button type="button" class="chip" data-chip="${f.id}" data-multi="0" data-v="${i}" aria-pressed="${String(v) === String(i)}">${i}</button>`;
      return wrap(f, lblDiv + help + `<div class="scale" style="--n:${n}" role="group" aria-labelledby="l-${f.id}" id="f-${f.id}">${body}</div><div class="scale-lbls"><span>${esc(f.lo)}</span><span>${esc(f.hi)}</span></div>`);
    }
    case "injuries":
      body = REGIONS.map(([k, name]) => {
        const st = data["inj_" + k] || "None";
        SHOW["injd_" + k] = d => (d["inj_" + k] || "None") !== "None";
        const chips = ["None", "Past", "Current"].map(o => `<button type="button" class="chip" data-chip="inj_${k}" data-multi="0" data-v="${o}" aria-pressed="${st === o}">${o}</button>`).join("");
        const side = ["Left", "Right", "Both", "Centre"].map(o => `<button type="button" class="chip" data-chip="inj_${k}_side" data-multi="0" data-v="${o}" aria-pressed="${data["inj_" + k + "_side"] === o}">${o}</button>`).join("");
        let pain = "";
        for (let i = 0; i <= 10; i++) pain += `<button type="button" class="chip" data-chip="inj_${k}_pain" data-multi="0" data-v="${i}" aria-pressed="${String(data["inj_" + k + "_pain"]) === String(i)}">${i}</button>`;
        return `<div class="inj-row"><div class="inj-top"><b>${name}</b><div class="chips">${chips}</div></div>
          <div class="inj-detail" data-show="injd_${k}">
            <div class="chips" aria-label="${name} side">${side}</div>
            <div><div class="help" style="margin:0 0 6px">Pain right now (0–10)</div><div class="scale" style="--n:11">${pain}</div></div>
            <input type="text" data-f="inj_${k}_note" id="f-inj_${k}_note" placeholder="What happened, what makes it worse, what helps" value="${esc(data["inj_" + k + "_note"])}" aria-label="${name} notes">
          </div></div>`;
      }).join("");
      return wrap(f, lblDiv + help + `<div class="inj">${body}</div>`);
    case "lifts":
      body = LIFTS.map(([k, name]) => `<tr><td>${name}</td>
        <td><input type="number" inputmode="decimal" step="any" data-f="lift_${k}_w" id="f-lift_${k}_w" value="${esc(data["lift_" + k + "_w"])}" aria-label="${name} weight"></td>
        <td><input type="number" inputmode="numeric" step="1" min="1" data-f="lift_${k}_r" id="f-lift_${k}_r" value="${esc(data["lift_" + k + "_r"])}" aria-label="${name} reps"></td>
        <td class="e1rm" data-e1rm="${k}"></td></tr>`).join("");
      return wrap(f, lblDiv + help + `<div class="tbl-wrap"><table class="lifts"><thead><tr><th>Lift</th><th>Weight (<span data-unit="lifts">${wu(data)}</span>)</th><th>Reps</th><th>Est. 1RM</th></tr></thead><tbody>${body}</tbody></table></div>
        <span class="unit">Max strict bodyweight pull-ups <input type="number" inputmode="numeric" data-f="pullups" id="f-pullups" value="${esc(data.pullups)}" style="max-width:90px"></span>`);
  }
}
function wrap(f, inner) { return `<div class="field" data-field="${f.id}"${f.show ? ` data-show="${f.id}"` : ""}>${inner}</div>`; }

function renderSteps() {
  const nav = $("#steps");
  nav.innerHTML = SECTIONS.map((s, i) => `<button type="button" data-step="${i}" ${i === step ? 'aria-current="step"' : ""}>

/* ---------- Calculations ---------- */
function e1rm(k, d) {
  const w = num(d["lift_" + k + "_w"]), r = num(d["lift_" + k + "_r"]);
  if (w == null || !r || r < 1 || r > 20) return null;
  const load = k === "chin" ? (num(d.wt) || 0) + w : w;
  if (!load) return null;
  return r === 1 ? load : load * (1 + r / 30); // Epley
}
const pct = (a, b) => (a != null && b) ? a / b : null;
const r50 = x => Math.round(x / 50) * 50;

// Structural balance: tested values first, the client's self-reported lifts as a fallback
function structuralBalance(d, lifts) {
  const bw = num(d.wt) || 0, rows = {};
  STRUCTURAL_BALANCE.forEach(t => {
    const w = num(d["sb_" + t.k + "_w"]), r = num(d["sb_" + t.k + "_r"]);
    let val = null, src = null;
    if (w != null && (t.mode === "rm" || (r && r >= 1 && r <= 10))) {
      const load = t.bw ? bw + w : w;
      val = t.mode === "rm" ? load : (r === 1 ? load : load * (1 + r / 30)); src = "tested";
    } else {
      const fb = { cgb: lifts.bench ? lifts.bench * 0.87 : null, chin: lifts.chin, bsq: lifts.squat, fsq: lifts.fsquat, dl: lifts.dead }[t.k];
      if (fb) { val = fb; src = t.k === "cgb" ? "est. from bench × 0.87" : "client-reported"; }
    }
    rows[t.k] = { ...t, val, src };
  });
  Object.values(rows).forEach(row => {
    if (row.base) return;
    const base = rows[row.of];
    row.target = base.val ? base.val * row.pct / 100 : null;
    row.ratio = row.val != null && row.target ? row.val / row.target : null;
    row.status = row.ratio == null ? null : row.ratio >= 0.95 ? "ok" : row.ratio >= 0.85 ? "warn" : "crit";
  });
  const weak = Object.values(rows).filter(r => r.status && r.status !== "ok").sort((a, b) => a.ratio - b.ratio);
  return { rows, weak, tested: Object.values(rows).some(r => r.src === "tested") };
}

// MAP: starting progression per pattern, asymmetries and restrictions
function mapResults(d) {
  const rows = [], issues = [];
  MAP_TESTS.forEach(t => {
    if (t.measure) {
      const L = num(d["map_" + t.k + "_l"]), R = num(d["map_" + t.k + "_r"]);
      if (L == null && R == null) return;
      rows.push({ ...t, L, R });
      [["Left", L], ["Right", R]].forEach(([side, v]) => { if (v != null && v < t.min) issues.push(`${t.name}: ${side.toLowerCase()} ${v} ${t.measure} (under ${t.min}). Add ankle mobility before loaded squats.`); });
      if (L != null && R != null && Math.abs(L - R) >= 2) issues.push(`${t.name}: ${Math.abs(L - R).toFixed(1)} ${t.measure} difference between sides.`);
      return;
    }
    const lvl = d["map_" + t.k];
    if (!lvl) return;
    const i = t.levels.indexOf(lvl);
    rows.push({ ...t, level: i + 1, start: lvl, side: d["map_" + t.k + "_side"], note: d["map_" + t.k + "_note"] });
    if (d["map_" + t.k + "_side"] && d["map_" + t.k + "_side"] !== "Even") issues.push(`${t.name}: ${d["map_" + t.k + "_side"].toLowerCase()}. Start unilateral work on the weaker side and match reps.`);
  });
  const regressed = rows.filter(r => r.level && r.level <= 2);
  return { rows, issues, regressed, scored: rows.length };
}

// Body composition: entered % or Jackson-Pollock 3-site skinfolds (Siri equation)
const BF_METHODS = ["Skinfold: Jackson-Pollock 3-site", "Skinfold: other protocol", "InBody / BIA", "DEXA", "Bod Pod", "Visual estimate"];
function bodyComp(d, kg, cm, age) {
  const female = d.sex === "Female";
  let bf = num(d.bf_pct), sum = null;
  if (d.bf_method === BF_METHODS[0]) {
    const sites = female ? [d.bf_tri, d.bf_supra, d.bf_thigh] : [d.bf_chest, d.bf_abd, d.bf_thigh];
    if (sites.every(v => num(v) != null) && age) {
      sum = sites.reduce((a, v) => a + num(v), 0);
      const bd = female ? 1.0994921 - 0.0009929 * sum + 0.0000023 * sum * sum - 0.0001392 * age : 1.10938 - 0.0008267 * sum + 0.0000016 * sum * sum - 0.0002574 * age;
      bf = Math.round((495 / bd - 450) * 10) / 10;
    }
  }
  if (bf == null || bf <= 0 || bf >= 70) return { bf: null, sum };
  const cuts = female ? [14, 21, 25, 32] : [6, 14, 18, 25];
  const NAMES = ["Essential / very lean", "Athletic", "Fitness", "Average", "Above average (obese range)"];
  const catIdx = bf < cuts[0] ? 0 : bf < cuts[1] ? 1 : bf < cuts[2] ? 2 : bf < cuts[3] ? 3 : 4;
  const tgtDefault = female ? (bf >= 32 ? 28 : bf >= 25 ? 23 : Math.max(18, bf - 3)) : (bf >= 25 ? 20 : bf >= 18 ? 15 : Math.max(10, bf - 3));
  const target = num(d.bf_target) ?? tgtDefault;
  const fatKg = kg ? kg * bf / 100 : null, lean = kg ? kg - fatKg : null;
  const goalKg = lean && target < bf ? lean / (1 - target / 100) : null;
  const waistCm = num(d.waist) != null ? (isImp(d) ? num(d.waist) * 2.54 : num(d.waist)) : null;
  return { bf, sum, cat: NAMES[catIdx], catIdx, target, targetIsDefault: num(d.bf_target) == null, fatKg, lean, goalKg, whtr: waistCm && cm ? waistCm / cm : null };
}

// Lipids: thresholds in mmol/L (mg/dL converted)
function lipidStatus(d) {
  const mg = d.lipid_units === "mg/dL";
  const conv = (v, f) => v == null ? null : mg ? v / f : v;
  const ldl = conv(num(d.ldl), 38.67), hdl = conv(num(d.hdl), 38.67), tg = conv(num(d.tg), 88.57);
  const flags = [], notes = [];
  if (ldl != null) { if (ldl >= 5) flags.push(["crit", `LDL ${d.ldl} ${d.lipid_units || "mmol/L"} is very high. Make sure their doctor is managing it.`]); else if (ldl >= 3.5) notes.push(`LDL ${d.ldl} is above the usual target`); }
  if (hdl != null && hdl < (d.sex === "Female" ? 1.3 : 1.0)) notes.push(`HDL ${d.hdl} is low`);
  if (tg != null) { if (tg >= 5.6) flags.push(["crit", `Triglycerides ${d.tg} are very high. Doctor follow-up needed.`]); else if (tg >= 1.7) notes.push(`triglycerides ${d.tg} are high`); }
  if (notes.length) flags.push(["warn", "Blood lipids: " + notes.join(", ") + ". Cholesterol nutrition protocol applies."]);
  const meds = d.meds_list || [];
  const concern = (d.conditions || []).includes("High cholesterol") || meds.includes("Statin (cholesterol)") || meds.includes("Other cholesterol medication") || (ldl != null && ldl >= 3.5) || (tg != null && tg >= 1.7) || (hdl != null && hdl < (d.sex === "Female" ? 1.3 : 1.0));
  return { ldl, hdl, tg, concern, highTg: tg != null && tg >= 1.7, flags };
}

function medicalProtocol(d, c) {
  const out = [], meds = d.meds_list || [];
  if (meds.includes("Statin (cholesterol)")) {
    const grape = /Atorvastatin|Simvastatin|Lovastatin/.test(d.statin_name || "");
    out.push(["Statin: training", "Train normally, progress slowly", "Exercise and statins work well together. The slow start (2 sessions a week, 6–15 reps) suits statin users; avoid big jumps in volume or long eccentric work in the first month."]);
    out.push(["Statin: warning signs", "Stop and see the doctor for new muscle pain, weakness or dark urine", "Normal soreness fades in 2–3 days and matches the work done. Pain that's out of proportion, lasts, or comes with weakness or dark urine is a medical issue, not soreness."]);
    out.push(["Statin: food and supplements", grape ? "Avoid grapefruit and grapefruit juice (or ask the pharmacist)" : "No grapefruit restriction for most statins of this type (confirm with the pharmacist)", "No red yeast rice (it contains the same compound as lovastatin) and no niacin without the doctor. CoQ10 is safe but the evidence is mixed; the doctor's call."]);
  }
  if (meds.includes("GLP-1 (Ozempic, Wegovy, Mounjaro, Zepbound)")) out.push(["GLP-1", "Protein first and resistance training every week", "These drugs cut appetite hard, so lean mass is at risk. Small protein-first meals, shakes if needed, fibre and water for the stomach side effects. The calorie target matters less than hitting protein."]);
  if (meds.includes("Metformin or other diabetes pill") || meds.includes("Insulin")) out.push(["Blood sugar", "Carbs around training; watch for lows", "Keep training times and meals consistent. Ask the doctor before cutting carbs hard, especially on insulin" + (meds.includes("Metformin or other diabetes pill") ? ". Long-term metformin can lower B12; worth checking at the next blood test." : ".")]);
  if (meds.includes("Blood pressure medication")) out.push(["Blood pressure", "Use effort (RPE), not heart rate, to judge intensity", "Some BP drugs (beta blockers) cap heart rate. Breathe through every rep, no breath-holding on heavy sets, and stand up slowly after floor work."]);
  if (meds.includes("Thyroid medication")) out.push(["Thyroid", "Same time every day, on an empty stomach", "Keep coffee, calcium and iron supplements away from the dose as the pharmacist advises. Don't change anything without the doctor."]);
  if (meds.includes("Blood thinner")) out.push(["Blood thinner", "No new supplements without the doctor", "Includes fish oil, vitamin E, turmeric and high-dose garlic. Bruising easily is common; report anything unusual."]);
  if (meds.includes("Antidepressant or anti-anxiety")) out.push(["Mood medication", "Expect appetite or weight changes; judge progress on trends", "Don't add St John's wort, 5-HTP or similar supplements without the doctor."]);
  const cond = d.conditions || [];
  if (cond.includes("High blood pressure") && !meds.includes("Blood pressure medication")) out.push(["Blood pressure", "Breathe through every rep; no breath-holding on heavy sets", "Lower sodium, more potassium-rich foods (vegetables, fruit, beans), less alcohol, and the weight loss itself all bring BP down. Recheck regularly."]);
  if (cond.includes("Kidney disease or reduced kidney function")) out.push(["Kidneys", "Protein and creatine set by their nephrologist or renal dietitian", "Typical medical targets for kidney disease are well below gym norms (often 0.55–0.8 g/kg), so the usual high-protein plan does not apply. Avoid regular NSAID painkillers, keep BP controlled, and follow their fluid advice."]);
  if (cond.includes("Kidney stones")) out.push(["Kidney stones", "2.5–3 L of fluid a day, lower sodium", "Get calcium from food, not mega-dose supplements. Ask their doctor which stone type they had; advice differs by type."]);
  if (cond.includes("Fatty liver")) out.push(["Fatty liver", "Lose 7–10% of body weight gradually (over months, not weeks)", "No crash diets or long fasts. 150–300 min of activity a week plus resistance training helps even before weight drops. Cut sugary drinks and added sugar, keep alcohol to none or very little, Mediterranean-style meals."]);
  if (cond.includes("Hepatitis or other liver disease")) out.push(["Liver disease", "No alcohol; no new supplements without their doctor", "Several supplements (e.g. green tea extract, high-dose vitamin A, some herbals) can stress the liver."]);
  if (cond.includes("Gout")) out.push(["Gout", "Limit alcohol (especially beer), sugary drinks and large servings of organ meats and shellfish", "Stay well hydrated; lose weight gradually, since rapid loss can trigger flares."]);
  if (c.lip.concern) {
    const L = [];
    L.push(["Cholesterol: weight", "Losing 5–10% of body weight is the first lever", "It improves LDL, triglycerides and HDL together."]);
    L.push(["Cholesterol: fibre", "10 g+ soluble fibre a day", "Oats or oat bran, barley, beans and lentils, psyllium (1 tbsp in water once or twice a day)."]);
    L.push(["Cholesterol: fats", `Saturated fat under ~${c.macros ? c.macros.satMax + " g" : "10% of calories"} a day`, "Swap fatty red and processed meat, butter, cream and coconut oil for olive oil, nuts, avocado and fish. Eggs are fine in moderation. Choose fish, eggs and poultry for the meat-and-nuts breakfast instead of red meat daily."]);
    L.push(["Cholesterol: foods that help", "A handful of nuts daily, fatty fish twice a week, soy foods", "Plant sterols (about 2 g a day from fortified foods) add another LDL drop; check with the doctor if on medication."]);
    if (c.lip.highTg) L.push(["Triglycerides", "Cut alcohol and sugary drinks first", "Triglycerides respond quickly to less alcohol, fewer refined carbs and more omega-3 fish."]);
    L.push(["Cholesterol: medication", "Never adjust or stop medication; that's the doctor's call", "Ask the client to share repeat blood work so you can track the effect of training and weight loss."]);
    out.push(...L);
  }
  return out;
}

// Early fat-loss protocol (first block)
function fatLossStart(d, c) {
  const g = d.goal_primary || "";
  if (!/Lose body fat|Recomp/.test(g) || !c.tdee) return null;
  const u = wu(d), rate = c.rateKg ? Math.abs(c.fromKg(c.rateKg)).toFixed(2) : null;
  const lean = c.comp.catIdx != null && c.comp.catIdx <= 2;
  const rows = [];
  rows.push(["Wk 1–2 · baseline", "No calorie cut yet", `Daily morning weigh-in (judge the weekly average), waist and photos. ${c.lowEater ? "Eat regular meals and start the protein ramp-up." : "Start the 2 chosen habits."} This finds real maintenance before anything changes.`]);
  rows.push(["Wk 3 · first cut", c.lowEater ? "Still no cut: build the eating habit first" : `Drop about ${fmt(r50(Math.max(250, c.tdee - c.target)))} kcal a day`, "Take it from carbs furthest from training and from added fats; protein never drops. Untracked clients: one less cupped hand of carbs at 2 meals."]);
  rows.push(["Every 2 weeks · adjust", rate ? `Target about ${rate} ${u} a week` : "Adjust by the trend", `Losing slower than target for 2 weeks: cut another 100–150 kcal or add 1,000–2,000 daily steps. Losing faster than 1% of body weight a week: add 100–150 kcal back.`]);
  if (d.wl_past === "Yes, but regained it all or more" || d.wl_past === "Yes, but regained some") rows.push(["Past regain", `Lost ${d.wl_amount ? d.wl_amount + " " + u + " " : ""}before${d.wl_how ? " (" + d.wl_how + ")" : ""}, then regained`, "Go slower than last time, keep the habits that will survive after the diet, and plan the maintenance phase before it starts. Ask what made it stop working."]);
  rows.push(["Activity", "Steps before cardio", "Raise daily steps first. Don't add training volume for fat loss; strength training is there to keep muscle."]);
  if (lean) rows.push(["Refeed (lean clients)", "One higher-carb day a week at maintenance", "Extra carbs from rice, potatoes and fruit; fat kept low. Helps training quality and diet fatigue."]);
  rows.push(["Wk 12–13 · diet break", "Maintenance calories during the deload week", "Diet phases run 8–12 weeks, then a maintenance break. Fat loss resumes in block 2 if needed."]);
  if (c.comp.goalKg) rows.push(["Goal", `${c.comp.target}% body fat ≈ ${fmt(c.fromKg(c.comp.goalKg))} ${u}`, `Keeping current lean mass. At ${rate || "the target"} ${u}/wk that's roughly ${Math.round((num(d.wt) - c.fromKg(c.comp.goalKg)) / (rate || 1))} weeks of dieting, with breaks between phases.`]);
  return rows;
}

// Nutrition agreement: loose rules the client signs off on
function nutritionAgreement(d, c) {
  const picks = (d.habit_pick || []).slice(0, 2);
  const auto = [];
  if (!picks.includes("Protein at every meal")) auto.push("Protein at every meal");
  if (["0–1", "2–3"].includes(d.veg)) auto.push("Vegetables at 2 meals a day");
  if ((d.pattern || []).includes("Eat late at night")) auto.push("Stop eating 2–3 h before bed");
  const rules = (picks.length ? picks : auto.slice(0, 2));
  const conf = num(d.habit_conf);
  const mealsWk = ({ "1–2": 2, "3": 3, "4": 4, "5+": 5 }[d.meals] || 3) * 7;
  const rows = [];
  rows.push(["Non-negotiables", rules.join(" · ") || "Protein at every meal", picks.length ? "Chosen by the client. Ownership drives adherence." : "Suggested from their answers; let them confirm or swap at the consult."]);
  if (conf != null && conf < 7) rows.push(["Confidence check", `Confidence ${conf}/10: make the habits smaller`, "Below 7/10, shrink the change (e.g. protein at 1 meal instead of every meal) until they're at 9/10 sure."]);
  rows.push(["Flexible", `About ${Math.round(mealsWk * 0.2)} of ${mealsWk} meals a week are free (80/20)`, "No banned foods. Free meals are planned, not cheats, and the next meal goes back to normal."]);
  rows.push(["Level up", "Hit 80% of days for 2 weeks in a row, then add one habit", `Level 1: 2 habits · Level 2: protein target and portions · Level 3: ${d.nut_pref === "Track calories & macros" ? "full macro tracking (their choice)" : "loose calorie range, only if they want it"}.`]);
  rows.push(["Weekly check-in", "Compliance %, weekly average weight, waist, energy, hunger", "Judge the plan on the trend and on compliance. Change the plan only when compliance is 80%+ and the trend stalls."]);
  return rows;
}

// Protein ramp-up for clients who eat little: from today's intake to target in ~20 g steps every 2 weeks
function proteinRamp(d, c) {
  if (!c.macros) return null;
  const target = c.macros.p;
  const est = num(d.protein_avg) ?? ({ "0": 30, "1": 50, "2": 75, "3+": 100 }[d.protein_meals]);
  if (est == null) return null;
  const current = Math.round(est / 5) * 5;
  if (current >= target * 0.9) return { current, target, steps: [], ok: true };
  const steps = []; let g = current, w = 1;
  while (g < target && steps.length < 8) { g = Math.min(target, g + 20); steps.push({ weeks: `Wk ${w}–${w + 1}`, g }); w += 2; }
  const fr = d.food_rel || [], dairyBad = (d.trigger_foods || []).includes("Dairy") || d.dairy === "I avoid it", veg = ["Vegetarian", "Vegan"].includes(d.diet_style);

  const powder = dairyBad || d.diet_style === "Vegan" || d.shakes === "Only dairy-free" ? "whey isolate or a pea/soy protein" : "whey";
  const foods = veg ? (d.diet_style === "Vegan" ? "tofu, tempeh, seitan, edamame, lentils, soy milk" : "eggs, Greek yogurt or skyr, cottage cheese, tofu, tempeh, lentils") : "eggs, Greek yogurt or skyr, cottage cheese, chicken, canned tuna or salmon, lean beef";

  const actions = [
    [`Wk 1–2 · +20 g`, `Add one protein serving to the meal you already eat most reliably${lowAm && shakeOk ? `. Not hungry in the morning: drink it (a ${powder} shake${dairyBad ? "" : " or a protein milk/skyr drink"})` : ""}.`],
    [`Wk 3–4`, `A palm of protein at every meal before anything else on the plate. Eat the protein first.`],
    [`Wk 5–6`, `Add one protein snack a day: ${noDairy(veg ? "Greek yogurt, edamame, protein bar" : "Greek yogurt, jerky, cottage cheese, hard-boiled eggs, a shake")}.`],
    [`Wk 7+`, `Grow portions by about 20 g a day every 2 weeks until ${target} g.`]
  ];
  const tips = [`Go-to foods: ${noDairy(foods)}.`, `Easy options: ${noDairy(easy)}.`];
  if (num(d.hunger) != null && num(d.hunger) <= 4) tips.push("Low appetite: liquid protein and softer foods (yogurt, eggs, shakes, soups) are easier than big plates of meat.");
  if (fr.some(x => x === "History of an eating disorder" || x === "Feeling out of control around food")) tips.push("Frame it as adding foods, never removing them; no tracking needed, count protein servings instead.");

}

// Meal-by-meal review for the consult: what they eat now and the first change to discuss
function mealReview(d, c) {
  const P = /egg|yog|skyr|protein|whey|shake|chicken|turkey|beef|steak|pork|ham|fish|salmon|tuna|shrimp|cottage|tofu|tempeh|lentil|bean|meat|jerky|cheese/i;
  const V = /salad|veg|broccoli|spinach|pepper|carrot|greens|lettuce|tomato|cucumber|zucchini|asparagus|kale|cauliflower|green beans|soup/i;
  const SW = /cookie|chip|chocolate|candy|pastry|muffin|donut|doughnut|croissant|cake|ice cream|soda|pop|juice|granola bar|cereal bar|sweet/i;
  const rows = [];
  const meals = [["Breakfast", d.meal_bfast], ["Morning snack", d.meal_snack1], ["Lunch", d.meal_lunch], ["Afternoon snack", d.meal_snack2], ["Supper", d.meal_supper], ["After supper", d.meal_evening]];
  meals.forEach(([k, t]) => {
    if (!filled(t)) return;
    const txt = String(t), none = /^(nothing|none|skip|no|n\/a|-)\b/i.test(txt.trim()), tips = [];
    if (none) tips.push(k === "Breakfast" ? "Skips breakfast: start with a protein drink or Greek yogurt rather than a full meal" : "Nothing here; fine if the rest of the day covers protein");

      if ((!V.test(txt) || /\b(no|not many|not much|few|hardly any|rarely|little)\s+(veg|vegetables|veggies|salad)/i.test(txt)) && /Lunch|Supper/.test(k)) tips.push("No vegetables: add a fist-sized serving");
      if (SW.test(txt)) tips.push("Sweet or packaged snack: swap for fruit + protein (yogurt, jerky, cheese, nuts)");
      if (k === "After supper") tips.push("Evening eating: set a kitchen-closed time 2–3 h before bed");
    }
    rows.push([k, txt, tips.join(" · ") || "Looks solid; keep it"]);
  });
  if (d.gluten === "I avoid it") rows.push(["Gluten", d.gluten_why === "Diagnosed celiac" ? "Celiac: strictly gluten-free" : "Avoids gluten", d.gluten_why === "Diagnosed celiac" ? "Plan meals around rice, potatoes, oats labelled gluten-free, quinoa and corn; watch sauces and cross-contamination." : "Respect it; carbs from rice, potatoes, oats, fruit and quinoa cover everything."]);
  if (d.dairy === "I avoid it") rows.push(["Dairy", d.dairy_why || "Avoids dairy", d.dairy_why === "Lactose intolerant" ? "Lactose-free milk, Greek yogurt and whey isolate are usually tolerated." : "Protein from eggs, meat, fish, tofu and a plant or isolate protein powder; calcium from fortified alternatives, greens and canned fish with bones."]);
  if (d.snacker === "All day long") rows.push(["Snacking", "Snacks all day", "Move to 3–4 set meals with protein; one planned snack. Grazing usually hides a lot of calories."]);
  return rows;
}

function nutritionProtocol(d, c) {
  const out = [], kg = c.kg, mealsN = { "1–2": 2, "3": 3, "4": 4, "5+": 5 }[d.meals] || 4;

  let method = d.nut_pref && d.nut_pref !== "Not sure" ? d.nut_pref : (d.tracks_food === "Track daily in an app" ? "Track calories & macros" : "Hit a protein target only");

function recoveryProtocol(d, c) {

    if (ww.includes("Hungry")) out.push(["Waking hungry", "More protein and fibre at supper", "Under-eating during the day shows up at night; check total intake before cutting anything."]);
    if (ww.includes("Mind racing")) out.push(["Racing mind", "Write tomorrow's list before bed; 5 min slow breathing in bed", "If they can't fall back asleep within 20 minutes, get up in dim light and return when sleepy."]);

  if (d.naps === "Daily") out.push(["Naps", "Keep naps under 20 min and before 3 pm", ""]);
  if (d.snore === "Snoring with gasping or pauses") out.push(["Sleep apnea", "Refer to a doctor for screening", "Treat before pushing fat loss or training volume."]);
  const st = num(d.stress);

  const stepsNext = { "Under 4,000": "5,000", "4,000–7,000": "8,000", "7,000–10,000": "10,000" }[d.steps];

  out.push(["Daily check-in", "Rate sleep, stress, soreness and motivation 1–5 before training", "Two or more scores of 1–2: cut the day's sets by about a third and stop 2 reps short of failure."]);

// Below Advanced: foundation → basic lifts + KILO split → deload → GBC 6-12-25 (hypertrophy, strength-biased A series)
function slowPlan(d, c) {
  const R = COACH_RULES, [ga, gb, gc] = R.gbc, L = Math.max(R.firstMonthsDays, c.laterDays || 2);
  const jump = c.older ? "+1–2%" : "+2–3%";
  const found = (n, stage, reps) => ({ name: `Foundation ${n}`, train: `${R.firstMonthsDays}×/wk full body · one limb at a time · A 3–4 × ${reps} constant load · B 3 × 12 · C building blocks stage ${stage} · 4-0-1-0` });
  const basics = n => ({ name: "Basic lifts + KILO split", train: `${c.afterSplit} · basic lifts introduced (goblet / heels-elevated squat, trap-bar deadlift, DB presses, rows, chin-ups) · A 4 × 10 → 4 × 8 · B 3 × 10–12 · C building blocks stage 3 · ${jump} when all reps are clean` });
  const gbc = (n, aSets, cSets) => ({ name: `GBC ${ga}-${gb}-${gc} · ${n}`, train: `${c.afterSplit} · A ${aSets} × ${ga} (step loading, strength focus) · B 3 × ${gb} · C ${cSets} × ${gc} · short rests on B/C, full rest on A · ${jump} on A when all reps are clean` });
  const plan = c.older
    ? [found(1, 1, "12–15"), found(2, 2, "10–12"), found(3, 3, "10–12")]
    : c.tier === 2

    : [found(1, 1, "12–15"), found(2, 2, "10–12"), basics()];
  plan.push(...(c.older ? [basics(), gbc("intro", 4, 2), gbc("build", 5, 3)] : [gbc("intro", 4, 2), gbc("build", 5, 3), gbc("peak + retest", 5, 3)]));
  return plan;
}

function roadmap(d, c) {
  const P = PROGRAM_PLAN, R = COACH_RULES, tier = c.tier ?? 0, adv = tier >= R.advancedTier;
  const F = R.firstMonthsDays, L = Math.max(F, c.laterDays || F);
  const uni = R.unilateralTiers.includes(tier), uni1 = R.unilateralBlock1Tiers.includes(tier);
  const g = d.goal_primary || "", fat = g === "Lose body fat", gain = g === "Build muscle";
  const NU = c.lowEater
    ? ["Regular meals + protein ramp-up · no deficit", "Protein ramp-up · eat to maintenance", ...(fat ? ["Small deficit starts", "Fat loss", "Fat loss", "Reverse to maintenance"] : gain ? ["Lean gain", "Lean gain", "Lean gain", "Lean gain or maintenance"] : ["Maintenance", "Maintenance", "Maintenance", "Maintenance"])]
    : c.phase === "Maintenance break first"
    ? ["Maintenance: diet break and habits", "Fat loss starts", "Fat loss", "Fat loss", "Fat loss", "Back to maintenance"]
    : fat ? ["Habits + small deficit", "Fat loss", "Fat loss", "Fat loss", "Fat loss", "Reverse to maintenance"]
    : gain ? ["Maintenance + habits", "Lean gain", "Lean gain", "Lean gain", "Lean gain", "Lean gain or maintenance"]
    : ["Maintenance + habits", "Maintenance", "Maintenance", "Maintenance", "Maintenance", "Maintenance"];
  const start = d.start_date ? new Date(d.start_date + "T00:00:00") : null;
  const dt = w => start && !isNaN(start) ? new Date(start.getTime() + (w - 1) * 7 * 864e5).toLocaleDateString(undefined, { month: "short", day: "numeric" }) : "";
  // monthly reassessment weeks: every 4 training weeks, skipping the deload
  const blockLen = P.blockWeeks + P.deloadWeeks;
  const checks = [];
  for (let b = 0; b < P.blocks; b++) for (let w = P.reassessEvery; w <= P.blockWeeks; w += P.reassessEvery) checks.push(b * blockLen + w);
  const finalWeek = P.blocks * P.blockWeeks + (P.blocks - 1) * P.deloadWeeks;
  const monthOf = w => Math.min(NU.length - 1, Math.floor((w - 1 - (w > P.blockWeeks ? P.deloadWeeks : 0)) / P.reassessEvery));
  const qualities = adv ? (KILO.focus[g] || ["Hypertrophy", "Relative strength"]) : ["Hypertrophy", "Hypertrophy (6+ reps)"];
  const phaseWeeks = adv ? 3 : R.phaseWeeks;
  if (!adv) c.slowPlan = slowPlan(d, c);
  const perBlock = Math.round(P.blockWeeks / phaseWeeks);
  const rows = [];
  let wk = 1, idx = 0;
  for (let b = 0; b < P.blocks; b++) {
    for (let i = 0; i < perBlock; i++, idx++) {
      const w0 = wk, w1 = wk + phaseWeeks - 1;
      let name, train;
      if (adv) {
        const q = qualities[b] || qualities[0], m = KILO.advanced[q][i % 4], meth = KILO.methods[q][i % 4];
        name = `${q} · ${m[0]}`; train = `A series ${m[2]} @ ~${m[1]}% · ${meth} · ${c.days || 4}×/wk`;
      } else {

        name = ph.name; train = ph.train;
      }
      const inside = checks.filter(w => w >= w0 && w <= w1);
      const test = inside.map(w => w === finalWeek ? `Wk ${w}: final retest (MAP, structural balance, body comp) · renewal review` : w % blockLen === P.blockWeeks ? `Wk ${w}: full reassessment (MAP, structural balance, body comp)` : `Wk ${w}: monthly check (weight trend, measurements, photos, MAP retest)`).join(" · ") || "Weekly check-ins";

  }
  return { rows, totalWeeks: wk - 1, qualities, phaseWeeks };
}

function calc(d) {
  const imp = isImp(d), toKg = x => x == null ? null : imp ? x * 0.45359237 : x, fromKg = x => imp ? x / 0.45359237 : x;
  const kg = toKg(num(d.wt));
  const cm = imp ? ((num(d.ht_ft) || 0) * 30.48 + (num(d.ht_in) || 0) * 2.54) || null : num(d.ht_cm);
  const age = num(d.age);

  const comp = bodyComp(d, kg, cm, age);

  const stepM = { "Under 4,000": 1.25, "4,000–7,000": 1.35, "7,000–10,000": 1.45, "10,000–13,000": 1.55, "Over 13,000": 1.65 }[d.steps] ?? 1.35;
  const jobA = { "Mostly sitting": 0, "Mixed sitting and standing": 0.05, "On my feet most of the day": 0.1, "Heavy physical work": 0.2 }[d.job_activity] || 0;
  const trA = { "1–2 days/week": 0.05, "3–4 days/week": 0.1, "5+ days/week": 0.15 }[d.train_now] || 0;
  const mult = Math.min(2.1, stepM + jobA + trA);
  const tdeeEst = bmr ? bmr * mult : null;

  // Intake + weight trend: expenditure = intake − stored energy change (≈7,700 kcal per kg over 28 days)
  let tdeeObs = null, obsNote = "";
  const cal = num(d.cal_avg);
  if (cal && ["Gone down", "Stayed about the same", "Gone up"].includes(d.wt_trend)) {
    const ch = d.wt_trend === "Stayed about the same" ? 0 : (toKg(num(d.wt_change)) || 0) * (d.wt_trend === "Gone down" ? -1 : 1);
    tdeeObs = cal - ch * 7700 / 28;
    obsNote = d.track_conf === "Rough guess" ? "rough tracking" : d.track_conf === "Mostly estimates" ? "estimated tracking" : "careful tracking";
  }
  // Careful logs are trusted outright; estimated logs usually under-count, so blend with the equation
  const blend = !(tdeeObs > 1000) || d.track_conf === "Rough guess" ? 0 : d.track_conf === "I weigh nearly everything" || !tdeeEst ? 1 : 0.6;
  const useObs = blend > 0;
  const tdee = blend ? blend * tdeeObs + (1 - blend) * (tdeeEst || 0) : tdeeEst;

  // Training age → program tier (0 Novice, 1 Developing, 2 Intermediate, 3 Advanced)
  const TIERS = ["Novice", "Developing", "Intermediate", "Advanced"];
  const rawTier = { "None yet": 0, "Under 6 months": 0, "6–12 months": 0, "1–2 years": 1, "2–4 years": 2, "4–7 years": 3, "7+ years": 3 }[d.train_age];
  const taNotes = [];
  let tier = rawTier ?? null;
  if (tier != null) {
    const drop = { "1–3 years ago": 1, "3+ years ago": 2 }[d.layoff] || 0;
    if (drop && tier > 0) { tier = Math.max(0, tier - drop); taNotes.push(`Detrained (${d.layoff.replace(" ago", "")} off): start ${drop} tier lower, move up fast as strength returns.`); }
    if (d.coached === "Mostly made it up as I went" && tier > 1) { tier--; taNotes.push("Years were unstructured; real training age is likely lower than stated."); }
  }
  const ageIdx = rawTier == null ? undefined : [0, 1, 1, 2][rawTier];
  const fem = d.sex === "Female" ? 0.7 : 1;
  const TH = { squat: [1.25, 1.75], bench: [0.9, 1.3], dead: [1.5, 2.2] };
  const lifts = {}; LIFTS.forEach(([k]) => lifts[k] = e1rm(k, d));
  const bw = num(d.wt);
  const strScores = Object.entries(TH).filter(([k]) => lifts[k] && bw).map(([k, [i, a]]) => { const r = lifts[k] / bw; return r >= a * fem ? 2 : r >= i * fem ? 1 : 0; });
  const strIdx = strScores.length ? Math.round(strScores.reduce((a, b) => a + b, 0) / strScores.length) : null;
  // Strength caps the tier: below beginner standards → at most Developing, below advanced → at most Intermediate
  if (tier != null && strIdx != null && tier > strIdx + 1) { tier = strIdx + 1; taNotes.push("Strength relative to body weight is behind the stated training age; programmed one tier lower."); }
  const tech = (d.technique || []).filter(x => x !== "None yet");
  if (tier != null && tier >= 2 && tech.length < 3) taNotes.push("Few lifts done confidently: spend phase 1 on technique for the main patterns.");
  const level = tier == null ? null : [0, 1, 1, 2][tier];
  const LEVELS = ["Beginner", "Intermediate", "Advanced"];
  const R = COACH_RULES;
  const PROGRAM = [
    { phase: "Foundation: building blocks, one limb at a time", reps: R.repRange + " (start 12–15)", tempo: "4-0-1-0 / 3-1-1-0", sets: "2–3 per exercise", rest: "60–90 s", change: `every ${R.phaseWeeks} weeks`,
      structure: "One limb at a time for all 6 months", methods: "Stability and control first; load goes up only when every rep is clean. Nothing heavy in year one" },
    { phase: "Foundation: building blocks, one limb at a time", reps: R.repRange + " (start 12–15)", tempo: "3-1-1-0", sets: "2–3 per exercise", rest: "60–90 s", change: `every ${R.phaseWeeks} weeks`,
      structure: "One limb at a time for all 6 months", methods: "Slow progressions; add sets before load. Nothing heavy in year one" },
    { phase: "Foundation (unilateral) in block 1, then hypertrophy with some bilateral lifts", reps: R.repRange + " (start 10–12)", tempo: "3-1-1-0 / 3-0-1-0", sets: "3 per exercise", rest: "75–90 s", change: `every ${R.phaseWeeks} weeks`,
      structure: "One limb at a time in block 1; some two-limb lifts in block 2", methods: "Building blocks for joints and trunk every session; no sets under 6 reps" },
    { phase: "Alternate accumulation and intensification", reps: "Intensification 1–5 · accumulation 6–8", tempo: "Controlled eccentric, explosive concentric on heavy work", sets: "5–8 per main lift", rest: "2–4 min on main lifts", change: "every 3–4 workouts",
      structure: "Bilateral primary lifts; unilateral assistance", methods: "Rep schemes from the goal's training quality (wave loading, stage and Paler systems, clusters)" }
  ];
  const program = tier == null ? null : PROGRAM[tier];

  // Recovery capacity
  const parts = [];
  const sl = { "Under 5 h": 0, "5–6 h": 0.3, "6–7 h": 0.6, "7–8 h": 0.9, "8+ h": 1 }[d.sleep_hrs]; if (sl != null) parts.push(sl);
  if (num(d.sleep_q)) parts.push((num(d.sleep_q) - 1) / 9);
  if (num(d.stress)) parts.push((10 - num(d.stress)) / 9);
  if (num(d.energy)) parts.push((num(d.energy) - 1) / 9);
  const dig = (d.digestion || []).filter(x => !["Regular daily bowel movements", "No issues"].includes(x));
  if ((d.digestion || []).length) parts.push(Math.max(0.2, 1 - dig.length * 0.25));
  const so = { "Rarely sore": 0.9, "Under a day": 1, "1–2 days": 0.75, "3+ days": 0.4 }[d.soreness]; if (so != null) parts.push(so);
  const recovery = parts.length >= 3 ? Math.round(parts.reduce((a, b) => a + b, 0) / parts.length * 100) : null;

  const days = num(d.days);
  const SPLITS = { 2: "Full body × 2", 3: "Full body × 3", 4: "Upper / Lower × 2", 5: "Upper / Lower + Push / Pull / Legs", 6: "Push / Pull / Legs × 2" };
  const slow = tier == null || tier < COACH_RULES.advancedTier;
  const laterDays = days ? Math.min(days, COACH_RULES.laterMaxDays) : COACH_RULES.laterMaxDays;
  const older = age != null && age >= COACH_RULES.ageSlow;
  const foundWeeks = older ? COACH_RULES.foundationWeeks50 : tier === 2 ? 4 : COACH_RULES.foundationWeeks;
  const afterSplit = laterDays >= 4 ? "Upper / Lower × 2 (KILO split)" : laterDays === 3 ? "Upper / Lower / Full body" : "Full body × 2 with basic lifts";
  const split = slow
    ? `Full body × ${COACH_RULES.firstMonthsDays} for weeks 1–${foundWeeks}, then ${afterSplit}`
    : days ? SPLITS[days] : null;
  if (slow && days && days > COACH_RULES.firstMonthsDays) taNotes.push(`Client has ${days} days available; keep it to ${COACH_RULES.firstMonthsDays} full-body sessions a week for the first ${foundWeeks} weeks. Extra days can be walks or mobility.`);
  if (older) taNotes.push(`Age ${age}: clients over ${COACH_RULES.ageSlow} take longer to get back to normal. Foundation runs ${foundWeeks} weeks, load jumps stay at 1–2%, warm-ups are longer, and recovery days are protected.`);

  // Energy target by goal
  const g = d.goal_primary || "";
  let ratePct = 0, phase = "Maintenance";
  const dietWeeks = num(d.diet_weeks);
  const dietFatigue = d.last_diet === "I'm dieting now" && dietWeeks != null && dietWeeks >= 12;
  if (g === "Lose body fat") { ratePct = comp.cat ? [-0.4, -0.4, -0.5, -0.6, -0.75][comp.catIdx] : (bmi && bmi >= 30 ? -0.75 : -0.5); phase = "Fat loss"; }
  else if (g === "Recomp (lose fat, build muscle)" && comp.catIdx >= 3) { ratePct = -0.4; phase = "Slow fat loss (recomp)"; }
  else if (g === "Build muscle") { ratePct = [0.5, 0.35, 0.25][level ?? 0]; phase = "Lean gain"; }
  else if (g === "Get stronger") { ratePct = 0.1; phase = "Maintenance to slight surplus"; }
  if (dietFatigue && ratePct < 0) { ratePct = 0; phase = "Maintenance break first"; }
  if (d.pregnant === "Currently pregnant" || d.pregnant === "Postpartum (under 12 months)") { ratePct = Math.max(0, ratePct); phase = "Maintenance (pregnancy / postpartum)"; }
  const eatingFlag = (d.food_rel || []).some(x => ["History of an eating disorder", "Feeling out of control around food"].includes(x));
  if (eatingFlag && ratePct < -0.5) ratePct = -0.5;
  let target = null, rateKg = null, macros = null;
  if (tdee && kg) {
    rateKg = kg * ratePct / 100;
    target = Math.max(bmr ? bmr : 1200, tdee + rateKg * 7700 / 7);
    const refKg = bmi && bmi >= 30 && cm ? 25 * (cm / 100) ** 2 : kg;
    // With body fat known: protein on lean mass (2.2–2.8 g/kg LBM); otherwise on body weight
    const p = lbm ? Math.round(lbm * 2.4 / 5) * 5 : Math.round(refKg * 2.0 / 5) * 5;
    const f = Math.round(Math.max(0.6 * (lbm || refKg), 0.28 * target / 9) / 5) * 5;
    const c = Math.max(0, Math.round((target - p * 4 - f * 9) / 4 / 5) * 5);
    macros = lbm ? { p, f, c, pLo: Math.round(lbm * 2.2), pHi: Math.round(lbm * 2.8), basis: "lean mass" } : { p, f, c, pLo: Math.round(refKg * 1.6), pHi: Math.round(refKg * 2.2), basis: "body weight" };
    macros.satMax = Math.round(target * 0.1 / 9);
    if ((d.conditions || []).includes("Kidney disease or reduced kidney function")) {
      const pk = Math.round(kg * 0.8 / 5) * 5;
      macros.c = Math.max(0, Math.round((target - pk * 4 - macros.f * 9) / 4 / 5) * 5);
      Object.assign(macros, { p: pk, pLo: pk, pHi: pk, basis: "0.8 g/kg placeholder: set by their nephrologist / renal dietitian", kidneyHold: true });
    } else if (age != null && age >= COACH_RULES.ageSlow && macros.p < kg * 1.4) {
      macros.p = Math.round(kg * 1.4 / 5) * 5; macros.c = Math.max(0, Math.round((target - macros.p * 4 - macros.f * 9) / 4 / 5) * 5); macros.basis += " (raised for age 50+)";
    }
  }

  const calAvg = num(d.cal_avg);
  const lowEater = !!((calAvg && bmr && calAvg < bmr * 1.3) || d.meals === "1–2" || ["0", "1"].includes(d.protein_meals) || ((d.pattern || []).includes("Skip breakfast") && d.am_appetite === "Not hungry"));
  const sb = structuralBalance(d, lifts);
  const map = mapResults(d);
  const lip = lipidStatus(d);

  // Flags
  const flags = [];
  const parqYes = PARQ.filter(k => d[k] === "Yes");
  if (parqYes.length) flags.push(["crit", d.cleared && d.cleared !== "Not yet" ? `PAR-Q: ${parqYes.length} “yes” answer(s); client reports clearance (${d.cleared.toLowerCase()}). Keep it on file.` : `PAR-Q: ${parqYes.length} “yes” answer(s). Get medical clearance before starting.`]);
  if (d.pregnant === "Currently pregnant" || d.pregnant === "Postpartum (under 12 months)") flags.push(["crit", `${d.pregnant}. Program for pregnancy / postpartum and confirm clearance.`]);
  if ((d.food_rel || []).includes("History of an eating disorder")) flags.push(["crit", "History of an eating disorder. Avoid aggressive deficits and close food tracking; consider working with a dietitian or therapist."]);
  else if ((d.food_rel || []).includes("Feeling out of control around food")) flags.push(["warn", "Feels out of control around food. Start with structure (regular meals, protein) before a deficit."]);
  const hurt = REGIONS.filter(([k]) => d["inj_" + k] === "Current").map(([k, n]) => [n, num(d["inj_" + k + "_pain"]) ?? 0, d["inj_" + k + "_side"]]);
  hurt.forEach(([n, p, side]) => flags.push([p >= 5 ? "crit" : "warn", `${n}${side ? ` (${side.toLowerCase()})` : ""}: current pain ${p}/10. ${p >= 5 ? "Refer out or assess before loading the area." : "Modify painful patterns; keep pain at or below 3/10 during and after training."}`]));
  if (d.physio === "Yes") flags.push(["warn", "Seeing a clinician now. Ask for their restrictions and coordinate."]);
  if (dietFatigue) flags.push(["warn", `${dietWeeks} weeks into a diet. Run 2–4 weeks at maintenance before more fat loss.`]);
  if (["Under 5 h", "5–6 h"].includes(d.sleep_hrs)) flags.push(["warn", `Sleeping ${d.sleep_hrs.replace(" h", " hours")}. Expect slower recovery; keep volume conservative.`]);
  if (num(d.stress) >= 8) flags.push(["warn", `Stress ${d.stress}/10. Keep the first block simple and the deficit small.`]);
  if (["8–14", "15+"].includes(d.alcohol)) flags.push(["warn", `${d.alcohol} drinks a week. Affects sleep, recovery and intake.`]);
  if (d.joint_ache === "Often") flags.push(["warn", "Joints often ache as volume rises. Start low and add sets slowly."]);
  if (d.snore === "Snoring with gasping or pauses") flags.push(["crit", "Snoring with gasping or pauses. Refer to a doctor for sleep apnea screening; it limits recovery and fat loss."]);
  if (num(d.libido) != null && num(d.libido) <= 3) flags.push(["warn", `Low sex drive (${d.libido}/10). Watch recovery and energy intake; suggest blood work if it persists.`]);
  if (d.sick === "4+") flags.push(["warn", "Sick 4+ times a year. Prioritise sleep and protein; suggest blood work (including vitamin D)."]);
  map.issues.forEach(i => flags.push(["warn", "MAP: " + i]));
  lip.flags.forEach(f => flags.push(f));
  const cl = num(d.commit_len === "Under 3 months" ? 2 : d.commit_len === "3–6 months" ? 4 : d.commit_len ? 12 : null);
  if (cl != null && cl < COACH_RULES.minCommitMonths) flags.unshift(["crit", `Commitment "${d.commit_len}" is under the ${COACH_RULES.minCommitMonths}-month minimum. Not a fit unless they commit to at least 6 months.`]);
  if (age != null && age >= COACH_RULES.ageSlow) flags.push(["warn", `Age ${age}: expect a slower return to normal. Longer foundation, smaller load jumps, protein at least 1.2–1.6 g/kg with 0.4 g/kg per meal.`]);
  const bpm = String(d.bp || "").match(/(\d{2,3})\s*\/\s*(\d{2,3})/);
  if (bpm) { const sy = +bpm[1], di = +bpm[2]; if (sy >= 160 || di >= 100) flags.push(["crit", `Blood pressure ${sy}/${di}: get doctor clearance before hard training.`]); else if (sy >= 140 || di >= 90) flags.push(["warn", `Blood pressure ${sy}/${di} is high. Avoid breath-holding on heavy sets; recheck regularly.`]); }
  const cond = d.conditions || [];
  if (cond.includes("Kidney disease or reduced kidney function")) flags.push(["crit", "Kidney disease: protein target and any creatine must be set or cleared by their nephrologist or renal dietitian. High-protein targets are on hold."]);
  if (cond.includes("Hepatitis or other liver disease")) flags.push(["crit", "Liver disease: no alcohol, and no new supplements without their doctor (many supplements stress the liver)."]);
  if (d.drugs === "Regular" || (d.drugs === "Occasional" && (d.drug_type || []).includes("Cocaine or other stimulants"))) flags.push(["crit", "Current drug use" + ((d.drug_type || []).length ? ` (${d.drug_type.join(", ").toLowerCase()})` : "") + ". Stimulants plus hard training stress the heart; talk about it openly and involve a doctor."]);
  else if (d.drugs === "Occasional") flags.push(["warn", "Occasional drug use: watch sleep, appetite and recovery after use days."]);
  else if (d.drugs === "Former") flags.push(["ok", "Former drug use" + (d.drug_when ? ` (stopped ${d.drug_when})` : "") + ". Keep routines stable; structure helps."]);
  if (d.alc_binge === "Weekly or more") flags.push(["warn", "Binge drinking weekly or more. Big effect on sleep, recovery and fat loss; make it part of the nutrition conversation."]);
  if (d.smoke === "Current smoker" || d.smoke === "Vape") flags.push(["warn", `${d.smoke === "Vape" ? "Vapes" : "Smokes"}${d.smoke_note ? " (" + d.smoke_note + ")" : ""}. Higher cardiovascular risk; encourage a quit plan with their doctor.`]);
  if ((d.wake_why || []).includes("To pee") && ["2+ times", "Same time most nights"].includes(d.wake_night)) flags.push(["warn", "Wakes to pee most nights. Common causes include late fluids or alcohol, sleep apnea, blood sugar and prostate issues; worth a doctor visit if it persists."]);
  if (d.statin_muscle === "Yes, it bothers me") flags.push(["crit", "Statin with bothersome muscle symptoms. Client should tell their doctor before training starts; keep loads light and eccentrics short until cleared."]);
  if ((d.meds_list || []).includes("Insulin")) flags.push(["warn", "On insulin. Ask about low blood sugar episodes; have fast carbs on hand at sessions."]);
  if ((d.meds_list || []).includes("Blood thinner")) flags.push(["warn", "On a blood thinner. No supplements (fish oil, vitamin E, turmeric, etc.) without their doctor's OK."]);
  if (d.wake_night === "Same time most nights") flags.push(["warn", "Wakes at the same time most nights. Look at evening food, alcohol, caffeine timing and stress."]);
  if (!flags.length && Object.keys(d).length > 6) flags.push(["ok", "No medical or injury flags reported. Clear to start."]);

  // First habits to build
  const habits = [];
  if (["Under 5 h", "5–6 h", "6–7 h"].includes(d.sleep_hrs)) habits.push("Sleep: fixed wake time and 7+ hours in bed, screens off 30–60 min before.");
  if (macros && (num(d.protein_avg) == null ? !(d.habits_now || []).includes("Protein at most meals") : num(d.protein_avg) < macros.p * 0.8)) {
    const m = { "1–2": 2, "3": 3, "4": 4, "5+": 5 }[d.meals] || 4; habits.push(`Protein: about ${Math.round(macros.p / m / 5) * 5} g at each of ${m} meals (${macros.p} g/day).`);
  }
  if (["Under 4,000", "4,000–7,000"].includes(d.steps)) habits.push("Steps: add 2,000 a day to the current average, then build to 8,000+.");
  if (dig.length) habits.push("Digestion: sort out bloating and regularity first (slower meals, fibre, trial removal of trigger foods).");
  if (["Under 1 L", "1–2 L"].includes(d.water)) habits.push("Water: about 2–3 L a day, more on training days.");
  if (["4–7", "8–14", "15+"].includes(d.alcohol)) habits.push("Alcohol: set a weekly cap and keep it off training nights.");
  if ((d.will_track || []).includes("Daily morning weight")) habits.push("Weigh in every morning; judge progress on the weekly average trend, not single days.");
  if (num(d.stress) >= 7) habits.push("Stress: a 10-minute walk or breathing break daily.");

  const out = { blend, kg, cm, age, bmi, bmr, mult, tdeeEst, tdeeObs, obsNote, useObs, tdee, level, tier, tierName: tier != null ? TIERS[tier] : null, rawTier, taNotes, program, tech, ageIdx, strIdx,
    lifts, recovery, split, slow, older, foundWeeks, laterDays, afterSplit, days, phase, ratePct, rateKg, target, macros, lowEater, comp, lbm, bmrMethod, lip, sb, map, flags, habits: habits.slice(0, 4), fromKg, imp };
  out.ramp = proteinRamp(d, out);
  out.medical = medicalProtocol(d, out);
  out.fatStart = fatLossStart(d, out);
  out.agreement = nutritionAgreement(d, out);
  out.nutrition = nutritionProtocol(d, out);
  out.meals = mealReview(d, out);
  out.recoveryPlan = recoveryProtocol(d, out);
  out.roadmap = roadmap(d, out);
  return out;
}

/* ---------- Coach report ---------- */
function setView(v) {
  ["form", "report", "library", "measure", "progress", "clients"].forEach(k => { $("#tab-" + k).setAttribute("aria-selected", v === k); $("#view-" + k).hidden = v !== k; });
  if (v === "report") renderReport();
  if (v === "library") renderLibrary();
  if (v === "measure") renderMeasure();
  if (v === "progress") renderProgress();
  if (v === "clients") renderClients();
  try { history.replaceState(null, "", "#" + v); } catch (e) {}
  window.scrollTo({ top: 0 });
}
function fmt(n, d = 0) { return n == null ? "–" : Number(n).toLocaleString(undefined, { maximumFractionDigits: d, minimumFractionDigits: d }); }

  const lvlTxt = c.tierName ? c.tierName : "Not enough info";
  const rec = c.recovery;
  const recColor = rec == null ? "var(--muted)" : rec < 50 ? "var(--crit)" : rec < 70 ? "var(--warn)" : "var(--ok)";
  const goalLine = [data.goal_primary, ...(data.goal_secondary || []).filter(x => x !== data.goal_primary)].filter(Boolean).join(" · ");
  const rateTxt = c.rateKg ? `${c.rateKg > 0 ? "+" : ""}${fmt(c.fromKg(c.rateKg), 2)} ${u}/week (${c.ratePct > 0 ? "+" : ""}${c.ratePct}% of body weight)` : "Hold weight steady";

  el.innerHTML = `<div class="report" style="padding-top:24px">
    ${isExample ? '<div class="example-banner">Example client. Replace with a real client\'s answers before using these numbers.</div>' : ""}

    <div class="rep-grid">

        <div class="big">${lvlTxt}<small>${esc(data.train_age || "training age not given")}</small></div>
        ${c.program ? `<dl class="kv left">
          <dt>Block 1 → 2</dt><dd>${esc(c.roadmap.qualities.join(" → "))}</dd>
          <dt>Phases</dt><dd>${c.roadmap.phaseWeeks} weeks each, accumulation and intensification alternating</dd>

          <dt>Target rate</dt><dd>${esc(rateTxt)}</dd>
          <dt>Protein</dt><dd>${c.macros ? `${c.macros.p} g <span style="color:var(--muted)">(${c.macros.pLo}–${c.macros.pHi})</span>` : "–"}</dd>
          <dt>Fat</dt><dd>${c.macros ? c.macros.f + " g" : "–"}</dd>
          <dt>Carbs</dt><dd>${c.macros ? c.macros.c + " g" : "–"}</dd>
          <dt>BMR</dt><dd>${c.bmr ? fmt(r50(c.bmr)) + " kcal · " + c.bmrMethod : "–"}</dd>
          ${c.kg && c.comp.catIdx != null && c.comp.catIdx <= 3 ? `<dt>Cross-check 10–12 kcal/lb</dt><dd>${fmt(r50(c.kg * 2.2046 * 10))}–${fmt(r50(c.kg * 2.2046 * 12))} kcal</dd>` : ""}
          ${c.macros ? `<dt>Protein basis</dt><dd>${c.macros.basis}</dd>` : ""}
