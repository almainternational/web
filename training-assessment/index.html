          ${data.diet_style && data.diet_style !== "No particular diet" ? `<li>Eating style: ${esc(data.diet_style)}${data.allergies ? "; allergies: " + esc(data.allergies) : ""}.</li>` : data.allergies ? `<li>Allergies: ${esc(data.allergies)}.</li>` : ""}</ul>
      </div>

      <div class="card"><h3><span class="dot" style="background:var(--p-yellow)"></span>Recovery capacity</h3>
        <div class="big">${rec == null ? "–" : rec}<small>/ 100</small></div>
        <div class="meter"><i style="width:${rec || 0}%;background:${recColor}"></i></div>
        <dl class="kv">
          <dt>Sleep</dt><dd>${esc(data.sleep_hrs || "–")} · quality ${esc(data.sleep_q || "–")}/10</dd>
          <dt>Stress</dt><dd>${esc(data.stress || "–")}/10</dd>
          <dt>Energy · mood</dt><dd>${esc(data.energy || "–")}/10 · ${esc(data.mood || "–")}/10</dd>
          <dt>Soreness lasts</dt><dd>${esc(data.soreness || "–")}</dd>
          <dt>Digestion</dt><dd>${esc((data.digestion || []).join(", ") || "–")}</dd>
          <dt>Schedule</dt><dd>${esc(data.schedule || "–")}</dd>
        </dl>
        <ul class="plain"><li>${rec == null ? "Needs the sleep, stress and energy answers." : rec < 50 ? "Low. Start below normal volume, keep the deficit small, and fix sleep and stress before pushing training." : rec < 70 ? "Moderate. Standard start; watch sleep and soreness week to week." : "Good. Can start at the upper end and progress normally."}</li></ul>
      </div>

      <div class="card"><h3><span class="dot" style="background:var(--p-green)"></span>Reported strength</h3>
        <div class="ratio">${LIFTS.filter(([k]) => c.lifts[k]).map(([k, n]) => `<span>${n.replace(" (added weight)", "")}</span><span>${fmt(c.lifts[k])} ${u}</span><span class="tag muted">${data.wt ? fmt(c.lifts[k] / num(data.wt), 2) + "× BW" : ""}</span>`).join("") || '<span style="color:var(--muted)">No lifts entered.</span><span></span><span></span>'}</div>
        <ul class="plain"><li>Client-reported, last 3 months. The structural balance test below replaces these with tested numbers.</li>${data.pullups ? `<li>Strict pull-ups: ${esc(data.pullups)}.</li>` : ""}</ul>
      </div>

      <div class="card"><h3><span class="dot" style="background:var(--p-white)"></span>First habits</h3>
        ${c.habits.length ? `<ul class="plain">${c.habits.map(h => `<li>${esc(h)}</li>`).join("")}</ul>` : '<p style="color:var(--muted);margin:0">Nothing urgent. Build on what the client already does.</p>'}
        <dl class="kv">
          <dt>Already consistent</dt><dd>${esc((data.habits_now || []).join(", ") || "–")}</dd>
          <dt>Barriers</dt><dd>${esc((data.barriers || []).join(", ") || "–")}</dd>
          <dt>Longest streak</dt><dd>${esc(data.streak || "–")}</dd>
          <dt>Readiness</dt><dd>${esc(data.commit || "–")}/10</dd>
          <dt>Check-ins</dt><dd>${esc(data.checkin || "–")}</dd>
          <dt>Coaching style</dt><dd>${esc(data.coach_style || "–")}</dd>
        </dl>
      </div>
    </div>

    ${c.fatStart ? `<div class="card"><h3><span class="dot" style="background:var(--p-red)"></span>Fat-loss start · block 1</h3><dl class="proto">${protoHTML(c.fatStart)}</dl></div>` : ""}
    ${c.meals.length ? `<div class="card"><h3><span class="dot" style="background:var(--p-blue)"></span>What they eat now</h3><p style="margin:0;color:var(--muted);font-size:14px">Use this to run the nutrition conversation at the consult: their words on the left, the first change to discuss on the right.</p><dl class="proto">${c.meals.map(([k, a, b]) => `<dt>${esc(k)}</dt><dd><b>${esc(a)}</b><span>${esc(b)}</span></dd>`).join("")}</dl></div>` : ""}
    <div class="card"><h3><span class="dot" style="background:var(--p-green)"></span>Nutrition agreement</h3><p style="margin:0;color:var(--muted);font-size:14px">Loose rules the client agrees to at the consult. Fewer rules, followed, beat a perfect plan that isn't.</p><dl class="proto">${protoHTML(c.agreement)}</dl></div>
    ${c.medical.length ? `<div class="card"><h3><span class="dot" style="background:var(--crit)"></span>Medications & cholesterol</h3><p style="margin:0;color:var(--muted);font-size:14px">Coaching guidance only. Medical decisions stay with the client's doctor and pharmacist.</p><dl class="proto">${protoHTML(c.medical)}</dl></div>` : ""}
    <div class="card"><h3><span class="dot" style="background:var(--p-blue)"></span>Nutrition protocol</h3><dl class="proto">${protoHTML(c.nutrition)}</dl></div>
    <div class="card"><h3><span class="dot" style="background:var(--p-yellow)"></span>Recovery protocol</h3><dl class="proto">${protoHTML(c.recoveryPlan)}</dl></div>

    <div class="card" id="roadCard">
      <div style="display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:flex-end">
        <h3><span class="dot" style="background:var(--p-red)"></span>6-month roadmap · ${c.roadmap.totalWeeks} weeks</h3>
        <label class="unit no-print">Start date <input type="date" data-f="start_date" id="f-start_date" value="${esc(data.start_date)}" style="max-width:170px;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:6px 8px"></label>
      </div>
      <div class="tbl-wrap"><table class="road"><thead><tr><th>Phase</th><th>Training (${esc(c.tierName || "tier not set")})</th><th>Nutrition</th><th>Reassessment</th></tr></thead><tbody>
        ${c.roadmap.rows.map(r => `<tr class="${r.deload ? "deload" : ""}"><td>${r.label}<span class="wk">${r.weeks}${r.date ? " · " + r.date : ""}</span></td><td>${esc(r.train)}</td><td>${esc(r.nutr)}</td><td>${esc(r.test)}</td></tr>`).join("")}
      </tbody></table></div>
      <p style="margin:0;color:var(--muted);font-size:13px">${c.slow ? "Below Advanced: hypertrophy only, no sets under 6 reps, 4-week phases with intensity rising slowly block to block." : "Advanced: 3-week mesocycles alternating accumulation and intensification; block 2 changes the training quality."} Monthly reassessments sit inside the phases. Weak links from MAP and structural balance lead block 1.</p>
    </div>

    ${buildingBlocksHTML(c)}

    ${rampHTML(c)}

    ${mapSectionHTML()}

    ${sbSectionHTML()}

    <div class="card"><h3>All answers</h3><div class="answers">${answersHTML()}</div></div>
    <p class="note">Estimates use standard formulas (Mifflin-St Jeor, Epley 1RM) and general coaching guidelines. They're a starting point to adjust from real progress, not medical or dietetic advice.</p>
  </div>`;
  updateSB(); updateMAP();
  $("#copyRep").onclick = () => copyText(reportText(), "Report copied");
  $("#dlRep").onclick = () => downloadText(reportText(), `${(data.name || "client").replace(/\W+/g, "-").toLowerCase()}-assessment.txt`);
  if (canPrint()) { $("#printRep").hidden = false; $("#printRep").onclick = () => window.print(); }
}

function blockPriority(b, c) {
  const why = [];
  b.inj.forEach(k => { const st = data["inj_" + k]; if (st && st !== "None") why.push(`${st.toLowerCase()} ${REGIONS.find(r => r[0] === k)[1].toLowerCase()} issue`); });
  c.map.rows.forEach(r => { if (b.map.includes(r.k) && ((r.level && r.level <= 2) || (r.side && r.side !== "Even") || (r.measure && ((r.L != null && r.L < r.min) || (r.R != null && r.R < r.min))))) why.push("MAP " + r.name.toLowerCase()); });
  return why;
}
function buildingBlocksHTML(c) {
  const adv = c.tier != null && c.tier >= COACH_RULES.advancedTier;
  const rows = BUILDING_BLOCKS.map(b => { const why = blockPriority(b, c); return `<tr><td><b>${b.area}</b>${why.length ? `<span class="tag warn" style="display:inline-block;margin-top:4px">priority · ${esc(why.join(", "))}</span>` : ""}</td>${b.stages.map(x => `<td>${esc(x)}</td>`).join("")}</tr>`; }).join("");
  return `<div class="card" id="blocksCard"><h3><span class="dot" style="background:var(--p-yellow)"></span>Building blocks · block 1</h3>
    <p style="margin:0;color:var(--muted);font-size:14px;max-width:76ch">${adv ? "Advanced client: use these as warm-ups and accessories for the priority areas." : `Every session in block 1. One limb at a time, ${COACH_RULES.repRange} reps, slow tempo; each stage runs ${COACH_RULES.phaseWeeks} weeks. Block 2 keeps stage 3 and adds load or a slower tempo.`} Priority areas get done first in the session and an extra set.</p>
    <div class="tbl-wrap"><table class="road"><thead><tr><th>Area</th><th>Wk 1–4</th><th>Wk 5–8</th><th>Wk 9–12</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
}
function rampHTML(c) {
  const r = c.ramp;
  if (!r) return "";
  if (r.ok) return `<div class="card"><h3><span class="dot" style="background:var(--p-blue)"></span>Protein ramp-up</h3><p style="margin:0">Already eating about ${r.current} g a day, close to the ${r.target} g target. Keep protein at every meal.</p></div>`;
  const max = r.target;
  const bars = [{ weeks: "Now", g: r.current }, ...r.steps].map(s => `<div style="display:grid;grid-template-columns:70px minmax(0,1fr) 56px;gap:10px;align-items:center;font-size:13px"><span class="mono" style="color:var(--muted)">${s.weeks}</span><div class="meter"><i style="width:${Math.round(s.g / max * 100)}%;background:${s.weeks === "Now" ? "var(--muted)" : "var(--accent)"}"></i></div><span class="mono">${s.g} g</span></div>`).join("");
  return `<div class="card" id="rampCard"><h3><span class="dot" style="background:var(--p-blue)"></span>Protein ramp-up</h3>
    <div class="big">${r.current} → ${r.target} g<small>per day · ${r.steps.length * 2} weeks${r.estimated ? " · current intake estimated from protein servings" : ""}</small></div>
    <div style="display:flex;flex-direction:column;gap:6px;max-width:560px">${bars}</div>
    <dl class="proto">${r.actions.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl>
    <ul class="plain">${r.tips.map(t => `<li>${esc(t)}</li>`).join("")}</ul></div>`;
}

function bodyCompHTML(c) {
  const f = data.sex === "Female", u = wu(data), lu = isImp(data) ? "in" : "cm", m = c.comp;
  const chips = BF_METHODS.map(o => `<button type="button" class="chip" data-chip="bf_method" data-multi="0" data-v="${esc(o)}" aria-pressed="${data.bf_method === o}">${esc(o)}</button>`).join("");
  const inp = (k, label, unit, w = 90) => `<label class="unit">${label} <input type="number" inputmode="decimal" step="0.5" data-f="${k}" data-rerender="1" id="f-${k}" value="${esc(data[k])}" style="max-width:${w}px"> ${unit}</label>`;
  const jp = data.bf_method === BF_METHODS[0];
  const sites = jp ? `<div style="display:flex;flex-wrap:wrap;gap:10px 18px">${(f ? [["bf_tri", "Triceps"], ["bf_supra", "Suprailiac"], ["bf_thigh", "Thigh"]] : [["bf_chest", "Chest"], ["bf_abd", "Abdomen"], ["bf_thigh", "Thigh"]]).map(([k, l]) => inp(k, l, "mm")).join("")}</div>` : "";
  const res = m.bf != null ? `<dl class="kv">
      <dt>Body fat</dt><dd>${m.bf}%${m.sum ? ` (sum ${m.sum} mm)` : ""}</dd>
      <dt>Category</dt><dd>${m.cat}</dd>
      <dt>Fat mass · lean mass</dt><dd>${fmt(c.fromKg(m.fatKg), 1)} · ${fmt(c.fromKg(m.lean), 1)} ${u}</dd>
      ${m.goalKg ? `<dt>At ${m.target}% body fat${m.targetIsDefault ? " (suggested)" : ""}</dt><dd>${fmt(c.fromKg(m.goalKg))} ${u} (−${fmt(num(data.wt) - c.fromKg(m.goalKg))} ${u})</dd>` : ""}
      ${m.whtr ? `<dt>Waist ÷ height</dt><dd>${m.whtr.toFixed(2)} ${m.whtr >= 0.5 ? '<span class="tag warn">above 0.5</span>' : '<span class="tag ok">under 0.5</span>'}</dd>` : ""}
    </dl>` : '<p class="note" style="margin:0">Enter body fat to switch BMR to lean mass, set protein on lean mass, pick the fat-loss rate and estimate a goal weight.</p>';
  return `<div class="card" id="compCard"><h3><span class="dot" style="background:var(--p-yellow)"></span>Body composition</h3>
    <div class="chips" data-rerender="1">${chips}</div>
    ${sites}
    <div style="display:flex;flex-wrap:wrap;gap:10px 18px">${jp ? "" : inp("bf_pct", "Body fat", "%")}${inp("waist", "Waist (at navel)", lu)}${inp("bf_target", "Target body fat", "%")}</div>
    ${res}
    <p style="margin:0;color:var(--muted);font-size:13px">Use the same method, time of day and tester each time; the trend matters more than the number. Ranges (ACE): men 6–13% athletic, 14–17% fitness, 18–24% average, 25%+ obese; women 14–20%, 21–24%, 25–31%, 32%+.</p></div>`;
}

function protoHTML(rows) {
  return rows.map(([k, main, sub]) => `<dt>${esc(k)}</dt><dd><b>${esc(main)}</b>${sub ? `<span>${esc(sub)}</span>` : ""}</dd>`).join("");
}
function mapSectionHTML() {
  let region = "";
  const rows = MAP_TESTS.map(t => {
    const head = t.region !== region ? `<div class="eyebrow" style="padding-top:14px">${(region = t.region)}</div>` : "";
    let body;
    if (t.measure) {
      body = `<div class="unit" style="flex-wrap:wrap">Left <input type="number" inputmode="decimal" step="0.5" data-f="map_${t.k}_l" id="f-map_${t.k}_l" value="${esc(data["map_" + t.k + "_l"])}" style="max-width:90px" aria-label="${t.name} left"> ${t.measure}
        &nbsp; Right <input type="number" inputmode="decimal" step="0.5" data-f="map_${t.k}_r" id="f-map_${t.k}_r" value="${esc(data["map_" + t.k + "_r"])}" style="max-width:90px" aria-label="${t.name} right"> ${t.measure} · minimum ${t.min} ${t.measure}</div>`;
    } else {
      const lv = t.levels.map((o, i) => `<button type="button" class="chip" data-chip="map_${t.k}" data-multi="0" data-v="${esc(o)}" aria-pressed="${data["map_" + t.k] === o}">${i + 1} · ${esc(o)}</button>`).join("");
      const side = t.sided ? `<div class="chips">${["Even", "Left weaker", "Right weaker"].map(o => `<button type="button" class="chip" data-chip="map_${t.k}_side" data-multi="0" data-v="${o}" aria-pressed="${data["map_" + t.k + "_side"] === o}">${o}</button>`).join("")}</div>` : "";
      body = `<div class="chips">${lv}</div>${side}<input type="text" data-f="map_${t.k}_note" id="f-map_${t.k}_note" value="${esc(data["map_" + t.k + "_note"])}" placeholder="Compensations seen (e.g. knees cave, heels lift, lumbar flexion)" aria-label="${t.name} notes">`;
    }
    return `${head}<div class="map-row"><div><b>${t.name}</b></div><div style="display:flex;flex-direction:column;gap:8px;min-width:0">${body}</div></div>`;
  }).join("");
  return `<div class="card" id="mapCard"><h3><span class="dot" style="background:var(--p-green)"></span>MAP assessment</h3>
    <p style="margin:0;color:var(--muted);font-size:14px;max-width:72ch">Score at the assessment session. Pick the progression the client can do with clean form; that's where they start. Retest regressed patterns at each monthly check.</p>
    <div>${rows}</div><div id="mapSummary"></div></div>`;
}
function updateMAP() {
  if (!$("#mapSummary")) return;
  const m = calc(data).map;
  if (!m.scored) { $("#mapSummary").innerHTML = '<p class="note" style="margin:0">No MAP results yet.</p>'; return; }
  const starts = m.rows.filter(r => r.start).map(r => `<li><b>${esc(r.name)}:</b> start with ${esc(r.start)} (level ${r.level} of ${r.levels.length})${r.note ? " · " + esc(r.note) : ""}</li>`).join("");

}

function sbSectionHTML() {
  const u = wu(data);
  const rows = STRUCTURAL_BALANCE.map(t => `${t.base ? `<tr class="sb-group"><th colspan="6">${t.group} · base: ${t.name}</th></tr>` : ""}
    <tr><td><b>${t.name}</b><div class="help" style="margin:0">${t.test}${t.base ? "" : ` · target ${t.pct}%`}</div></td>
      <td><input type="number" inputmode="decimal" step="any" data-f="sb_${t.k}_w" id="f-sb_${t.k}_w" value="${esc(data["sb_" + t.k + "_w"])}" aria-label="${t.name} weight${t.bw ? " added" : ""}" placeholder="${t.bw ? "added" : u}"></td>
      <td>${t.mode === "rm" ? `<span class="e1rm">${t.test.split(" · ")[0]}</span>` : `<input type="number" inputmode="numeric" step="1" min="1" max="10" data-f="sb_${t.k}_r" id="f-sb_${t.k}_r" value="${esc(data["sb_" + t.k + "_r"])}" aria-label="${t.name} reps" placeholder="reps">`}</td>
      <td class="e1rm" data-sbv="${t.k}"></td><td class="e1rm" data-sbt="${t.k}"></td><td data-sbs="${t.k}" style="min-width:150px"></td></tr>`).join("");
  return `<div class="card" id="sbCard"><h3><span class="dot" style="background:var(--p-green)"></span>Structural balance test</h3>
    <p style="margin:0;color:var(--muted);font-size:14px;max-width:70ch">Test at the first session. Enter a heavy set of 1–10 reps (converted to an estimated 1RM) or the stated rep max. Chin-ups and dips take the added weight; body weight is included. Blank rows fall back to the client's reported lifts.${calc(data).slow ? " <b>This client is below Advanced: don't test 1RMs. Use sets of 8–10 reps and let the page estimate.</b>" : ""}</p>
    <div class="tbl-wrap"><table class="lifts sb"><thead><tr><th>Lift</th><th>Weight (${u})</th><th>Reps</th><th>Result</th><th>Target</th><th>vs target</th></tr></thead><tbody>${rows}</tbody></table></div>
    <div id="sbSummary"></div></div>`;
}
function updateSB() {
  if (!$("#sbCard")) return;
  const c = calc(data), u = wu(data);
  Object.values(c.sb.rows).forEach(r => {
    const v = document.querySelector(`[data-sbv="${r.k}"]`), t = document.querySelector(`[data-sbt="${r.k}"]`), st = document.querySelector(`[data-sbs="${r.k}"]`);
    const dp = x => x < 50 ? 1 : 0;
    v.innerHTML = r.val != null ? `${fmt(r.val, dp(r.val))} ${u}${r.src !== "tested" ? `<div style="font-size:11px">${esc(r.src)}</div>` : ""}` : "–";
    t.textContent = r.base ? "base" : r.target ? `${fmt(r.target, dp(r.target))} ${u}` : "–";
    if (r.base || r.ratio == null) { st.innerHTML = r.base ? '<span class="tag muted">100%</span>' : ""; return; }
    const w = Math.min(100, r.ratio * 100), col = { ok: "var(--ok)", warn: "var(--warn)", crit: "var(--crit)" }[r.status];
    st.innerHTML = `<div style="display:flex;align-items:center;gap:8px"><div class="meter" style="flex:1;min-width:60px"><i style="width:${w}%;background:${col}"></i></div><span class="mono" style="font-size:12px">${Math.round(r.ratio * 100)}%</span></div>`;
  });
  const weak = c.sb.weak;
  $("#sbSummary").innerHTML = weak.length
    ? `<div class="flags">${weak.map(r => `<div class="flag ${r.status}"><span class="pill">${r.status === "crit" ? "Weak link" : "Low"}</span><span><b>${esc(r.name)}</b> at ${Math.round(r.ratio * 100)}% of target. Bring up ${esc(r.fix)}.</span></div>`).join("")}</div>`
    : Object.values(c.sb.rows).some(r => r.ratio != null) ? '<div class="flag ok"><span class="pill">Balanced</span><span>Every tested lift is within 5% of its target.</span></div>' : '<p class="note" style="margin:0">Enter the base lift and at least one other lift to see ratios.</p>';
}

function answerRows() {
  const u = wu(data);
  return SECTIONS.map(s => {
    const rows = [];
    flat(s.fields).forEach(f => {

function measureCalc(m, sex) {

function liveStats(r, u) {
  const t = (label, v, sub) => `<div class="stat"><span class="eyebrow">${label}</span><span class="v">${v}</span>${sub ? `<span class="d flat">${sub}</span>` : ""}</div>`;
  return t("Sum", r.sum != null ? r.sum + "<small style=\"font-size:14px\"> mm</small>" : "–", "14 sites") + t("Body fat", r.pct != null ? r.pct + "%" : "–", BF_EQS[r.method] || "") + t("Fat mass", r.fat != null ? fmt(r.fat, 1) : "–", u) + t("Lean mass", r.lean != null ? fmt(r.lean, 1) : "–", u);
}
function parseHistory(txt) {
  const rows = []; let skipped = 0, order = 0;
  String(txt).split(/\r?\n/).forEach(line => {
    if (!line.trim()) return;
    const dm = line.match(/(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})|(\d{4})-(\d{2})-(\d{2})/);
    if (!dm) { skipped++; return; }
    const iso = dm[4] ? `${dm[4]}-${dm[5]}-${dm[6]}` : `${dm[3]}-${dm[2].padStart(2, "0")}-${dm[1].padStart(2, "0")}`;
    const rest = line.slice(dm.index + dm[0].length);
    let n;
    if (rest.includes("\t")) {
      const cells = rest.split("\t").map(c => c.trim()); if (cells[0] === "") cells.shift();
      // sheet layout: age, cm, in, kg, lb, 14 sites, sum, %fat, fat kg, fat lb, lean kg, lean lb
      if (cells.length >= 19) {
        const g = i => num(cells[i]);
        const lb = g(4), kg = g(3), wt = isImp(data) ? (lb ?? (kg != null ? kg * 2.20462 : null)) : (kg ?? (lb != null ? lb / 2.20462 : null));
        const sites = Object.fromEntries(SITES14.map(([k], i) => [k, cells[5 + i]]));
        const pct = g(20);
        rows.push({ id: newId(), order: order++, date: iso, age: cells[0], wt: wt != null ? String(Math.round(wt * 10) / 10) : "", sites, method: pct != null ? "manual" : "sp14", pct: pct != null ? String(pct) : "" });
        return;
      }
    }
    n = (rest.match(/-?\d+(?:\.\d+)?/g) || []);
    if (n.length < 17) { skipped++; return; }
    const sites = Object.fromEntries(SITES14.map(([k], i) => [k, n[3 + i]]));
    const pct = n.length >= 19 ? n[18] : "";
    rows.push({ id: newId(), order: order++, date: iso, age: n[0], wt: n[2], sites, method: pct ? "manual" : "sp14", pct });
  });
  return { rows, skipped };
}

      ${data.goal_1yr ? `<dt>1-year goal</dt><dd><b>${esc(data.goal_1yr)}</b></dd>` : ""}
    </dl></div></div>`;
  if (ms.length > 1) { drawComp($("#chartComp"), shown, u); drawPct($("#chartPct"), shown); }
  if ($("#baseSel")) $("#baseSel").onchange = e => { baseId = e.target.value; renderProgress(); };
  $("#bioToggle").onchange = e => { showBiosig = e.target.checked; renderProgress(); };
  $("#dlProg").onclick = () => {
    const L = [`PROGRESS · ${data.name || "Client"}`, `${fmtDate(first.date)} → ${fmtDate(last.date)} (${ms.length} tests)`, "",
      `Body fat: ${first.r.pct}% → ${last.r.pct}%`, `Fat mass: ${fmt(first.r.fat, 1)} → ${fmt(last.r.fat, 1)} ${u}`, `Lean mass: ${fmt(first.r.lean, 1)} → ${fmt(last.r.lean, 1)} ${u}`, `Weight: ${fmt(first.r.wt, 1)} → ${fmt(last.r.wt, 1)} ${u}`, "", "Site changes (mm):", ...siteRows.map(x => `- ${x.n}: ${x.a} → ${x.b}`)];
    downloadText(L.join("\n"), `${(data.name || "client").replace(/\W+/g, "-").toLowerCase()}-progress.txt`);
  };
}
function chartFrame(el, ms, yMin, yMax, draw, tipFn) {
  const W = 720, H = 260, pl = 44, pr = 64, pt = 12, pb = 28;
  const t0 = new Date(ms[0].date).getTime(), t1 = new Date(ms[ms.length - 1].date).getTime() || t0 + 1;
  const x = d => pl + ((new Date(d).getTime() - t0) / Math.max(1, t1 - t0)) * (W - pl - pr);
  const y = v => pt + (1 - (v - yMin) / (yMax - yMin)) * (H - pt - pb);
  const ticks = []; const step = niceStep((yMax - yMin) / 4); for (let v = Math.ceil(yMin / step) * step; v <= yMax + 1e-9; v += step) ticks.push(v);
  const yrs = [...new Set(ms.map(m => m.date.slice(0, 4)))];
  const xt = ms.length <= 8 ? ms.map(m => [x(m.date), new Date(m.date + "T00:00:00").toLocaleDateString(undefined, { month: "short", day: "numeric", year: yrs.length > 1 ? "2-digit" : undefined })]) : yrs.map(yv => [x(yv + "-01-01") < pl ? pl : x(yv + "-01-01"), yv]);
  const xtF = []; xt.forEach(t => { if (!xtF.length || t[0] - xtF[xtF.length - 1][0] >= 48) xtF.push(t); });
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img">
    ${ticks.map(v => `<line x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--viz-grid)" stroke-width="1"/><text x="${pl - 8}" y="${y(v) + 4}" text-anchor="end">${fmt(v, step < 1 ? 1 : 0)}</text>`).join("")}
    ${xtF.map(([xx, l]) => `<text x="${xx}" y="${H - 8}" text-anchor="middle">${esc(l)}</text>`).join("")}
    ${draw(x, y)}
    <line class="xh" x1="0" x2="0" y1="${pt}" y2="${H - pb}" stroke="var(--muted)" stroke-dasharray="3 3" visibility="hidden"/>
    <rect x="${pl}" y="${pt}" width="${W - pl - pr}" height="${H - pt - pb}" fill="transparent" class="hit"/></svg><div class="tip" hidden></div>`;
  const svg = el.querySelector("svg"), tip = el.querySelector(".tip"), xh = el.querySelector(".xh");
  const move = ev => {
    const r = svg.getBoundingClientRect(), px = (ev.clientX - r.left) / r.width * W;
    let bi = 0, bd = 1e9; ms.forEach((m, i) => { const dd = Math.abs(x(m.date) - px); if (dd < bd) { bd = dd; bi = i; } });
    const m = ms[bi], xx = x(m.date);
    xh.setAttribute("x1", xx); xh.setAttribute("x2", xx); xh.setAttribute("visibility", "visible");
    tip.hidden = false; tip.innerHTML = tipFn(m); tip.style.left = (xx / W * 100) + "%"; tip.style.top = (pt / H * r.height + 24) + "px";
  };
  svg.querySelector(".hit").addEventListener("mousemove", move);
  svg.querySelector(".hit").addEventListener("mouseleave", () => { tip.hidden = true; xh.setAttribute("visibility", "hidden"); });
  svg.querySelector(".hit").addEventListener("touchstart", e => move(e.touches[0]), { passive: true });
}
function niceStep(raw) { const p = Math.pow(10, Math.floor(Math.log10(raw || 1))), f = raw / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p; }
function drawComp(el, ms, u) {
  const maxW = Math.max(...ms.map(m => m.r.wt)), yMax = Math.ceil(maxW / 20) * 20 + 10;
  chartFrame(el, ms, 0, yMax, (x, y) => {
    const lean = ms.map(m => `${x(m.date)},${y(m.r.lean)}`).join(" "), top = ms.map(m => `${x(m.date)},${y(m.r.wt)}`).join(" ");
    const base = `${x(ms[ms.length - 1].date)},${y(0)} ${x(ms[0].date)},${y(0)}`;
    const leanRev = ms.slice().reverse().map(m => `${x(m.date)},${y(m.r.lean) - 1}`).join(" ");
    const last = ms[ms.length - 1], lx = x(last.date);
    return `<polygon points="${lean} ${base}" fill="var(--viz-lean)" opacity=".85"/>
      <polygon points="${top} ${leanRev}" fill="var(--viz-fat)" opacity=".85"/>
      <polyline points="${top}" fill="none" stroke="var(--ink)" stroke-width="2"/>
      <text x="${lx + 8}" y="${y(last.r.wt) + 4}" style="fill:var(--ink)">${fmt(last.r.wt, 1)} ${u}</text>`;
  }, m => `<b>${esc(fmtDate(m.date))}</b><br>Weight ${fmt(m.r.wt, 1)} ${u}<br>Fat ${fmt(m.r.fat, 1)} ${u} (${m.r.pct}%)<br>Lean ${fmt(m.r.lean, 1)} ${u}`);
}
function drawPct(el, ms) {
  const vals = ms.map(m => m.r.pct), lo = Math.floor(Math.min(...vals) - 2), hi = Math.ceil(Math.max(...vals) + 2);
  chartFrame(el, ms, lo, hi, (x, y) => {
    const pts = ms.map(m => `${x(m.date)},${y(m.r.pct)}`).join(" "), last = ms[ms.length - 1];
    return `<polyline points="${pts}" fill="none" stroke="var(--viz-fat)" stroke-width="2" stroke-linejoin="round"/>
      ${ms.map(m => `<circle cx="${x(m.date)}" cy="${y(m.r.pct)}" r="4" fill="var(--viz-fat)" stroke="var(--surface)" stroke-width="2"/>`).join("")}
      <text x="${x(last.date) + 10}" y="${y(last.r.pct) + 4}" style="fill:var(--ink)">${last.r.pct}%</text>`;
  }, m => `<b>${esc(fmtDate(m.date))}</b><br>${m.r.pct}% body fat`);
}

}
function bindReview() {

}

/* ---------- Copy / download helpers (work standalone and inside a Claude artifact) ---------- */
function canPrint() { try { return window.self === window.top && !window.claude; } catch (e) { return false; } }
async function copyText(txt, msg) {
  try { await navigator.clipboard.writeText(txt); toast(msg); }
  catch (e) {
    const ta = document.createElement("textarea"); ta.value = txt; ta.style.cssText = "position:fixed;top:0;left:0;width:100%;height:50%;z-index:9";
    document.body.appendChild(ta); ta.focus(); ta.select();
    let ok = false; try { ok = document.execCommand("copy"); } catch (_) {}
    if (ok) { ta.remove(); toast(msg); } else { toast("Press Ctrl/Cmd+C to copy, then click anywhere"); ta.addEventListener("blur", () => ta.remove()); }
  }
}
async function downloadText(txt, filename) {
  if (window.claude && typeof window.claude.use === "function") {
    try { const dl = await window.claude.use("downloads"); if (dl) { await dl.save({ filename, data: txt }); return; } } catch (e) { toast("Download cancelled. Use Copy instead."); return; }
  }
  try {
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([txt], { type: "text/plain" })); a.download = filename;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  } catch (e) { toast("Download isn't available here. Use Copy instead."); }
}
